# Creates or updates the repository labels from .github/labels.yml. Never deletes labels.
name: labels
on:
  push:
    branches: [dev]
    paths: [".github/labels.yml", ".github/scripts/sync_labels.py"]
  workflow_dispatch:
permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sync labels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/scripts/sync_labels.py .github/labels.yml
