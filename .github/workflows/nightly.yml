# Longer-running checks that are too slow for pull requests.
# Scheduled workflows run on the default branch (dev).
name: nightly
on:
  schedule:
    - cron: "17 18 * * *" # 03:17 JST
  workflow_dispatch:
permissions: {}

env:
  ROS_DISTRO: lyrical

jobs:
  fuzz:
    name: fuzz (frame reader, 5 min)
    runs-on: ubuntu-latest
    container: ros:lyrical-ros-base-resolute
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src/lagrange
          persist-credentials: false
      - name: Install dependencies
        run: src/lagrange/tools/ci/install_deps.sh clang libclang-rt-dev
      - name: Build the fuzz target with Clang, ASan and UBSan
        shell: bash
        env:
          CC: clang
          CXX: clang++
        run: |
          source "/opt/ros/$ROS_DISTRO/setup.bash"
          colcon build --packages-up-to lagrange_proto --event-handlers console_cohesion+ \
            --cmake-args -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=OFF \
            -DLAGRANGE_BUILD_FUZZERS=ON "-DLAGRANGE_SANITIZER=address;undefined"
      - name: Fuzz
        run: >-
          install/lagrange_proto/lib/lagrange_proto/fuzz_frame_reader
          -max_total_time=300 -max_len=8192 -print_final_stats=1

  nav2-demo:
    name: Nav2 demo (AMR patrols the warehouse)
    runs-on: ubuntu-latest
    container: ros:lyrical-ros-base-resolute
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src/lagrange
          persist-credentials: false
      - name: Install dependencies
        run: src/lagrange/tools/ci/install_deps.sh
      # The same cached OpenUSD underlay as the ci workflow (same key).
      - name: Restore the OpenUSD underlay
        id: openusd
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: openusd_ws/install
          key: >-
            openusd-${{ runner.arch }}-${{ hashFiles('src/lagrange/vendor/openusd_vendor/CMakeLists.txt',
            'src/lagrange/vendor/openusd_vendor/cmake/**', 'src/lagrange/vendor/openusd_vendor/env-hooks/**') }}
      - name: Build the OpenUSD underlay
        if: steps.openusd.outputs.cache-hit != 'true'
        shell: bash
        run: |
          source "/opt/ros/$ROS_DISTRO/setup.bash"
          colcon build --base-paths src/lagrange/vendor/openusd_vendor \
            --build-base openusd_ws/build --install-base openusd_ws/install \
            --event-handlers console_cohesion+
      - name: Build the server and the demo
        shell: bash
        run: |
          source openusd_ws/install/setup.bash
          colcon build --packages-up-to lagrange_server lagrange_demos \
            --packages-skip lagrange_viewer openusd_vendor --event-handlers console_cohesion+ \
            --cmake-args -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=OFF
      - name: Patrol for 10 simulated minutes without a collision
        shell: bash
        run: src/lagrange/tools/ci/nav2_demo.sh 10

  benchmarks:
    name: benchmarks (scheduler, bus, lidar per tier)
    runs-on: ubuntu-latest
    container: ros:lyrical-ros-base-resolute
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src/lagrange
          persist-credentials: false
      - name: Install dependencies
        run: src/lagrange/tools/ci/install_deps.sh
      - name: Build the benchmarks
        shell: bash
        run: |
          source "/opt/ros/$ROS_DISTRO/setup.bash"
          colcon build --packages-up-to lagrange_benchmarks --event-handlers console_cohesion+ \
            --cmake-args -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=OFF
      # The hosted runner has no GPU: Tier 1 runs on llvmpipe. Shared runners vary, so this
      # baseline is checked with a wide margin (docs/design/benchmarks.md).
      - name: Run and compare with the baseline
        shell: bash
        env:
          MAX_SLOWDOWN: "2.0"
        run: src/lagrange/tools/ci/benchmarks.sh ci-ubuntu-latest benchmark-results

  tutorial:
    name: tutorial (docs/guide/tutorial-amr.md, end to end)
    runs-on: ubuntu-latest
    container: ros:lyrical-ros-base-resolute
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src/lagrange
          persist-credentials: false
      - name: Install dependencies
        run: src/lagrange/tools/ci/install_deps.sh
      - name: Build what the tutorial uses
        shell: bash
        run: |
          source "/opt/ros/$ROS_DISTRO/setup.bash"
          colcon build --packages-up-to lagrange_server lagrange_demos lagrange_tutorial \
            --packages-skip lagrange_viewer --event-handlers console_cohesion+ \
            --cmake-args -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=OFF
      - name: Run every step of the tutorial
        shell: bash
        run: src/lagrange/tools/ci/tutorial_amr.sh

  determinism:
    name: determinism (the sample AMR run twice, 60 s, state hashes compared)
    runs-on: ubuntu-latest
    container: ros:lyrical-ros-base-resolute
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src/lagrange
          persist-credentials: false
      - name: Install dependencies
        run: src/lagrange/tools/ci/install_deps.sh
      - name: Build the server
        shell: bash
        run: |
          source "/opt/ros/$ROS_DISTRO/setup.bash"
          colcon build --packages-up-to lagrange_server --packages-skip lagrange_viewer \
            --event-handlers console_cohesion+ \
            --cmake-args -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=OFF
      - name: Run twice and compare
        shell: bash
        run: |
          source install/setup.bash
          ros2 run lagrange_server lagrange determinism \
            "$(ros2 pkg prefix lagrange_profiles)/share/lagrange_profiles/examples/amr_sample_urdf.yaml" \
            --seconds 60
