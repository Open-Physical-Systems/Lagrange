# Hook revisions were resolved from each upstream repository on 2026-10-13.
# Hooks planned in docs/plan/repo-tooling.md but not enabled yet: mdformat (needs a one-time
# reformat of docs/), mypy and buf (no Python package or proto files yet), shfmt, commitizen
# (PR titles are checked in .github/workflows/pr-checks.yml), check-jsonschema.
minimum_pre_commit_version: "4.0.0"
exclude: \.pgm$   # binary occupancy-map images that `identify` takes for text
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
      - id: check-added-large-files   # blocks accidental big assets
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: mixed-line-ending
        args: [--fix=lf]
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v21.1.6                      # same version as Ubuntu 26.04's clang-format
    hooks:
      - id: clang-format
        types_or: [c++, c]
  - repo: https://github.com/BlankSpruce/gersemi-pre-commit
    rev: 0.29.2
    hooks:
      - id: gersemi
        args: [-i, --no-warn-about-unknown-commands]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]
        exclude: ^\.clang-(format|tidy)$
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
  - repo: https://github.com/crate-ci/typos
    rev: v1.51.1
    hooks:
      - id: typos
        args: [--force-exclude]       # report only; never rewrite files
  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse
  - repo: local
    hooks:
      - id: position-types
        name: no float world or region positions (invariant 6)
        entry: python3 tools/lint/check_position_types.py
        language: system
        types_or: [c++, c, proto]
        exclude: ^tools/lint/fixtures/
      - id: position-types-selftest
        name: position-types lint self-test
        entry: python3 -m unittest discover -s tools/lint
        language: system
        pass_filenames: false
        files: ^tools/lint/
