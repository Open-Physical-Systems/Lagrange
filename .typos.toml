[files]
# CHANGELOG.md is generated by release-please and holds commit hashes, which are not words.
extend-exclude = ["LICENSE", "LICENSES/", "docs/imgs/", "*.usda", "*.mcap", "docs/design/ui/**/reference.html", "OFL.txt", "CHANGELOG.md"]

[default.extend-words]
# Abbreviations and names that are not typos.
sitl = "sitl"   # software in the loop
lod = "lod"     # level of detail
thr = "thr"     # PX4 parameter names: THR_MDL_FAC, MPC_THR_HOVER
ned = "ned"     # north-east-down, the aerospace navigation frame
parm = "parm"   # ArduPilot parameter files (.parm)
thst = "thst"   # ArduPilot parameter names: MOT_THST_HOVER
nd = "nd"       # OpenStreetMap XML: a way's node reference element <nd ref=...>

[default.extend-identifiers]
# SDFormat PbrWorkflow::Metalness.
Metalness = "Metalness"
# POSIX msghdr field.
msg_controllen = "msg_controllen"
