# A generic 10-inch three-blade multicopter propeller, made up for the samples (not a product):
# the two-blade sample's blade shape (generic_10in_2blade_*) at 0.95 of its chord and 5.0 in of
# constant geometric pitch, three blades. Not matched to a measured propeller: what it does
# follows from its geometry and sections alone: static CT 0.152 and CP 0.0641 by blade-element
# momentum, so more thrust than the two-blade at the same diameter and speed.
#
# Section data: NACA 6412 at the lowest Reynolds number of NACA Report 586 (Jacobs and Sherman,
# 1937; public domain), figure 8, test R = 41,800 (effective about 110,000 with the variable-
# density tunnel's turbulence factor of 2.64, the report's), which is where a 10-inch propeller
# works near hover (chord about 30 mm at 57 m/s: R ≈ 110,000). Read off the chart: zero-lift
# angle −5°, lift slope about 0.1 per degree, maximum lift 1.35, profile drag 0.023 at cl 0.7
# rising to 0.027 at cl 0.2 (about twice the high-Reynolds-number value: laminar separation).
# Chart readings to about ±5 %.
format: lagrange-propeller-1
name: Generic 10 in, 3 blades, cw
diameter: 0.254          # m
blades: 3
hand: cw
aerofoils:
  naca6412_low_re:
    lift_slope: 5.73     # 1/rad (0.1 per degree)
    zero_lift_angle: -5.0  # deg
    cl_max: 1.35
    cl_min: -0.3         # TODO(verify): the chart's negative stall is off its range
    cd_min: 0.023
    cl_at_cd_min: 0.7
    cd_lift: 0.016
    camber: 0.06         # drawing: NACA 6412's mean line
    camber_position: 0.4
stations:
  - {r: 0.15, chord: 0.1235, twist: 46.70, thickness: 0.20, aerofoil: naca6412_low_re}
  - {r: 0.25, chord: 0.1976, twist: 32.48, thickness: 0.16, aerofoil: naca6412_low_re}
  - {r: 0.40, chord: 0.2347, twist: 21.70, thickness: 0.13, aerofoil: naca6412_low_re}
  - {r: 0.55, chord: 0.2223, twist: 16.14, thickness: 0.12, aerofoil: naca6412_low_re}
  - {r: 0.70, chord: 0.1852, twist: 12.81, thickness: 0.12, aerofoil: naca6412_low_re}
  - {r: 0.85, chord: 0.1358, twist: 10.61, thickness: 0.11, aerofoil: naca6412_low_re}
  - {r: 0.95, chord: 0.0864, twist: 9.51, thickness: 0.10, aerofoil: naca6412_low_re}
  - {r: 1.00, chord: 0.0494, twist: 9.04, thickness: 0.10, aerofoil: naca6412_low_re}
