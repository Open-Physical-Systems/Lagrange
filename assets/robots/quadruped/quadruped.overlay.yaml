# Power system of the sample quadruped (docs/design/formats.md §9): twelve joint drives on a 48 V
# bus fed by an LFP battery, and the onboard computer as a load. Applied to quadruped.urdf by
# `lagrange_server --overlay`, `lagrange_import --overlay` and Python's `overlay=`. Every value is
# the sample AMR's (amr_diffdrive.overlay.yaml), the same drive on each joint; illustrative, not a
# real product, and not sized for this robot. What that gives:
#   - drive current limit 8 A: 0.085 N·m/A x 8 A x 20 x 0.92 = 12.5 N·m at the joint, below the
#     URDF's 40 N·m effort limit, so here the drive is the binding limit (standing takes about
#     6 N·m at a rear knee: docs/plan/spikes/legged-contact.md §2's 43.5 N per rear foot);
#   - top joint speed 20 rad/s is 400 rad/s at the motor: back-EMF 0.085 x 400 = 34 V, inside
#     the bus voltage;
#   - 16 LFP cells in series (51.2 V nominal), 20 Ah; the pack's port is rated 40 A, less than
#     twelve drives at their limit (96 A).
# No thermal nodes: the electrical domain alone, so a run with and without it differs by that.
schema_version: 1
apply:
  - create: power/battery
    schemas:
      BatteryAPI_1:
        elec:battery:chemistry: lfp
        elec:battery:seriesCells: 16
        elec:battery:capacity: 72000.0           # C (20 Ah)
        elec:battery:ocvSoc: [0.0, 0.1, 0.5, 0.9, 1.0]
        elec:battery:ocvVoltage: [2.80, 3.20, 3.28, 3.33, 3.45]   # V per cell
        elec:battery:r0: 0.0015                  # ohm per cell
        elec:battery:r1: 0.0008                  # ohm per cell
        elec:battery:c1: 12000.0                 # F per cell
        elec:battery:cutoffVoltage: 44.8         # V, 2.8 V per cell
        elec:battery:maxChargeCurrent: 10.0      # A
      PortAPI_1:dc_out:
        elec:port:dc_out:nominalVoltage: 51.2    # V
        elec:port:dc_out:maxCurrent: 40.0        # A
        elec:port:dc_out:connectedTo: power/dc_48v
  - create: power/dc_48v
    schemas:
      ElectricalBusAPI_1:
        elec:bus:capacitance: 0.0047             # F
        elec:bus:undervoltageTrip: 42.0          # V
        elec:bus:overvoltageTrip: 60.0           # V
  - create: power/computer
    schemas:
      ElectricalLoadAPI_1:
        elec:load:model: constant_power
        elec:load:power: 45.0                    # W
        elec:load:minVoltage: 36.0               # V
        elec:powerPort: power/dc_48v
  - prim: front_left_hip_joint
    create_child: front_left_hip_motor
    schemas:
      ElectricalMotorAPI_1:
        elec:windingResistance: 0.12             # ohm at 25 °C
        elec:inductance: 0.00031                 # H
        elec:torqueConstant: 0.085               # N·m/A
        elec:polePairs: 4
        elec:rotorInertia: 0.00012               # kg·m²
        elec:gearRatio: 20.0
        elec:gearEfficiency: 0.92
        elec:maxCurrent: 8.0                     # A
        elec:joint: front_left_hip_joint
        elec:powerPort: power/dc_48v
  - prim: front_left_thigh_joint
    create_child: front_left_thigh_motor
    schemas:
      ElectricalMotorAPI_1:
        elec:windingResistance: 0.12
        elec:inductance: 0.00031
        elec:torqueConstant: 0.085
        elec:polePairs: 4
        elec:rotorInertia: 0.00012
        elec:gearRatio: 20.0
        elec:gearEfficiency: 0.92
        elec:maxCurrent: 8.0
        elec:joint: front_left_thigh_joint
        elec:powerPort: power/dc_48v
