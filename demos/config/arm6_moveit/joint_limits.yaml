# Speeds from the URDF; accelerations for time parameterization (rad/s², m/s²). Scaled by the
# planning request's velocity and acceleration factors (1.0: full speed).
default_velocity_scaling_factor: 1.0
default_acceleration_scaling_factor: 1.0
joint_limits:
  shoulder_pan_joint: {has_velocity_limits: true, max_velocity: 2.0, has_acceleration_limits: true, max_acceleration: 6.0}
  shoulder_lift_joint: {has_velocity_limits: true, max_velocity: 2.0, has_acceleration_limits: true, max_acceleration: 6.0}
  elbow_joint: {has_velocity_limits: true, max_velocity: 2.5, has_acceleration_limits: true, max_acceleration: 8.0}
  wrist_1_joint: {has_velocity_limits: true, max_velocity: 3.0, has_acceleration_limits: true, max_acceleration: 12.0}
  wrist_2_joint: {has_velocity_limits: true, max_velocity: 3.0, has_acceleration_limits: true, max_acceleration: 12.0}
  wrist_3_joint: {has_velocity_limits: true, max_velocity: 3.0, has_acceleration_limits: true, max_acceleration: 12.0}
  finger_left_joint: {has_velocity_limits: true, max_velocity: 0.1, has_acceleration_limits: true, max_acceleration: 1.0}
  finger_right_joint: {has_velocity_limits: true, max_velocity: 0.1, has_acceleration_limits: true, max_acceleration: 1.0}
