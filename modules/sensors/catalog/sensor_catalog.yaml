  event_camera:
    name: Event camera
    category: camera
    description: A dynamic vision sensor (iniVation DAVIS346, Prophesee) making events from successive
      rendered frames, as ESIM and v2e do.
    doc: docs/design/domains/sensors.md#event_camera
    references:
      - iniVation DAVIS346 specification sheet (15 August 2019)
      - ESIM (Rebecq, Gehrig and Scaramuzza, CoRL 2018)
      - v2e (Hu, Liu and Delbruck, CVPR Workshops 2021; v2ecore/v2e_args.py)
    renders: true
    params:
      - path: width
        type: int
        unit: px
        default: 346
        min: 1
        source: iniVation DAVIS346 specification sheet (15 August 2019)
        meaning: the pixel array (also <camera><image><width>)
      - path: height
        type: int
        unit: px
        default: 260
        min: 1
        source: iniVation DAVIS346 specification sheet (15 August 2019)
        meaning: (also <camera><image><height>)
      - path: horizontal_fov
        type: number
        unit: rad
        default: 1.2357
        source: iniVation DAVIS346 specification sheet (15 August 2019) (70.8°, 4.5 mm lens)
        meaning: (also <camera><horizontal_fov>)
        min_exclusive: 0
        max_exclusive: 3.1
      - path: near_clip
        type: number
        unit: m
        default: 0.05
        meaning: (also <camera><clip><near>)
      - path: threshold_on
        type: number
        unit: ln
        default: 0.2
        source: v2e (Hu, Liu and Delbruck, CVPR Workshops 2021; v2ecore/v2e_args.py) default
        meaning: ON contrast threshold
        min_exclusive: 0
      - path: threshold_off
        type: number
        unit: ln
        default: 0.2
        source: v2e (Hu, Liu and Delbruck, CVPR Workshops 2021; v2ecore/v2e_args.py) default
        meaning: OFF contrast threshold
        min_exclusive: 0
      - path: threshold_sigma
        type: number
        unit: ln
        default: 0.03
        min: 0
        source: v2e (Hu, Liu and Delbruck, CVPR Workshops 2021; v2ecore/v2e_args.py)
        meaning: per-pixel threshold mismatch, 1σ
      - path: refractory_period
        type: number
        unit: s
        default: 0.0005
        min: 0
        source: v2e (Hu, Liu and Delbruck, CVPR Workshops 2021; v2ecore/v2e_args.py) default (iniVation
          publishes none)
        meaning: held after a pixel's event
      - path: noise_rate
        type: number
        unit: Hz
        default: 0.1
        min: 0
        source: v2e (Hu, Liu and Delbruck, CVPR Workshops 2021; v2ecore/v2e_args.py) paper's typical
          leak rate
        meaning: background activity per pixel
      - path: max_events
        type: int
        unit: '1'
        default: 20000
        min: 1
        max: 1000000
        meaning: events per step kept in events
    signals:
      - name: events
        type: scalar_array
        unit: '1'
        length_from: 4 × max_events (x, y, t, polarity)
      - name: count
        type: int
      - name: dropped
        type: int
      - name: image
        type: image
      - name: image/intrinsics
        type: scalar_array
        unit: '1'
        length: 4
      - name: image/position
        type: vec3
        unit: m
    ros:
      - topic: events
        type: sensor_msgs/msg/PointCloud2
      - topic: image/image_raw
        type: sensor_msgs/msg/Image
      - topic: image/camera_info
        type: sensor_msgs/msg/CameraInfo
  force_torque:
    name: Force-torque sensor
    category: motion_and_force
    description: A six-axis force-torque sensor (a wrist sensor) from the joint's reaction, moved
      to the sensor's origin and turned into its frame, then offset, noise, low-pass, range and resolution
      per axis.
    doc: docs/design/domains/sensors.md#force_torque
    references:
      - ATI Mini45, calibration SI-580-20 (ati-ia.com, F/T sensor models, Mini45, table "Metric Calibrations
        (SI)")
    renders: false
    params:
      - path: joint
        type: text
        default_from: the joint whose child is the sensor's body
        refers_to: joint
        meaning: the joint whose reaction it reads (a hinge or a slide)
      - path: measure_direction
        type: enum
        default: parent_to_child
        choices:
          - parent_to_child
          - child_to_parent
        meaning: child_to_parent reverses the wrench
      - path: preset
        type: enum
        default_from: none
        choices:
          - mini45_si_580_20
        meaning: 'a part''s ranges and resolutions (noise: one resolution step, 1 sigma, an assumption)'
        source: 'ATI Mini45 SI-580-20: ranges Fx, Fy 580 N, Fz 1160 N, Tx, Ty, Tz 20 N·m; resolutions
          1/4 N, 1/188 N·m (Tx, Ty), 1/376 N·m (Tz)'
      - path: cutoff_frequency
        type: number
        unit: Hz
        default: 0.0
        min: 0
        meaning: 'first-order low-pass; 0: none'
      - path: force_range
        type: number
        unit: N
        default: .inf
        default_note: 'mini45_si_580_20: the preset''s'
        meaning: clipping, per axis (saturated reads 1), every force axis
      - path: fx_range
        type: number
        unit: N
        default_from: force_range
        meaning: clipping, per axis (saturated reads 1), fx only
      - path: fy_range
        type: number
        unit: N
        default_from: force_range
        meaning: clipping, per axis (saturated reads 1), fy only
      - path: fz_range
        type: number
        unit: N
        default_from: force_range
        meaning: clipping, per axis (saturated reads 1), fz only
      - path: force_resolution
        type: number
        unit: N
        default: 0.0
        default_note: 'mini45_si_580_20: the preset''s'
        meaning: 'step the reading is rounded to; 0: none, every force axis'
      - path: fx_resolution
        type: number
        unit: N
        default_from: force_resolution
        meaning: 'step the reading is rounded to; 0: none, fx only'
      - path: fy_resolution
        type: number
        unit: N
        default_from: force_resolution
        meaning: 'step the reading is rounded to; 0: none, fy only'
      - path: fz_resolution
        type: number
        unit: N
        default_from: force_resolution
        meaning: 'step the reading is rounded to; 0: none, fz only'
      - path: force_noise
        type: number
        unit: N
        default: 0.0
        default_note: 'mini45_si_580_20: one resolution step'
        meaning: 1 sigma, per axis, every force axis
      - path: fx_noise
        type: number
        unit: N
        default_from: force_noise
        meaning: 1 sigma, per axis, fx only
      - path: fy_noise
        type: number
        unit: N
        default_from: force_noise
        meaning: 1 sigma, per axis, fy only
      - path: fz_noise
        type: number
        unit: N
        default_from: force_noise
        meaning: 1 sigma, per axis, fz only
      - path: force_offset
        type: number
        unit: N
        default: 0.0
        meaning: bias, per axis, every force axis
      - path: fx_offset
        type: number
        unit: N
        default_from: force_offset
        meaning: bias, per axis, fx only
      - path: fy_offset
        type: number
        unit: N
        default_from: force_offset
        meaning: bias, per axis, fy only
      - path: fz_offset
        type: number
        unit: N
        default_from: force_offset
        meaning: bias, per axis, fz only
      - path: torque_range
        type: number
        unit: N·m
        default: .inf
        default_note: 'mini45_si_580_20: the preset''s'
        meaning: clipping, per axis (saturated reads 1), every torque axis
      - path: tx_range
        type: number
        unit: N·m
        default_from: torque_range
        meaning: clipping, per axis (saturated reads 1), tx only
      - path: ty_range
        type: number
        unit: N·m
        default_from: torque_range
        meaning: clipping, per axis (saturated reads 1), ty only
      - path: tz_range
        type: number
        unit: N·m
        default_from: torque_range
        meaning: clipping, per axis (saturated reads 1), tz only
      - path: torque_resolution
        type: number
        unit: N·m
        default: 0.0
        default_note: 'mini45_si_580_20: the preset''s'
        meaning: 'step the reading is rounded to; 0: none, every torque axis'
      - path: tx_resolution
        type: number
        unit: N·m
        default_from: torque_resolution
        meaning: 'step the reading is rounded to; 0: none, tx only'
      - path: ty_resolution
        type: number
        unit: N·m
        default_from: torque_resolution
        meaning: 'step the reading is rounded to; 0: none, ty only'
      - path: tz_resolution
        type: number
        unit: N·m
        default_from: torque_resolution
        meaning: 'step the reading is rounded to; 0: none, tz only'
      - path: torque_noise
        type: number
        unit: N·m
        default: 0.0
        default_note: 'mini45_si_580_20: one resolution step'
        meaning: 1 sigma, per axis, every torque axis
      - path: tx_noise
        type: number
        unit: N·m
        default_from: torque_noise
        meaning: 1 sigma, per axis, tx only
      - path: ty_noise
        type: number
        unit: N·m
        default_from: torque_noise
        meaning: 1 sigma, per axis, ty only
      - path: tz_noise
        type: number
        unit: N·m
        default_from: torque_noise
        meaning: 1 sigma, per axis, tz only
      - path: torque_offset
        type: number
        unit: N·m
        default: 0.0
        meaning: bias, per axis, every torque axis
      - path: tx_offset
        type: number
        unit: N·m
        default_from: torque_offset
        meaning: bias, per axis, tx only
      - path: ty_offset
        type: number
        unit: N·m
        default_from: torque_offset
        meaning: bias, per axis, ty only
      - path: tz_offset
        type: number
        unit: N·m
        default_from: torque_offset
        meaning: bias, per axis, tz only
    signals:
      - name: wrench
        type: wrench
        unit: N
        frame: sensor:<n>
      - name: force
        type: vec3
        unit: N
        frame: sensor:<n>
      - name: torque
        type: vec3
        unit: N·m
        frame: sensor:<n>
      - name: saturated
        type: bool
    ros:
      - topic: wrench
        type: geometry_msgs/msg/WrenchStamped
  gripper_sensor:
    name: Gripper sensor
    category: motion_and_force
    description: What a gripper's controller knows about its grasp - the opening, the motor current,
      whether it holds something and whether that slips. Mount it on the hand; the fingers are joints.
    doc: docs/design/domains/sensors.md#gripper_sensor
    references: []
    renders: false
    params:
      - path: fingers
        type: text
        default_from: none (required)
        refers_to: joint
        meaning: finger joint names, separated by spaces
      - path: motors
        type: text
        default_from: none (the current is the torque proxy)
        refers_to: motor
        meaning: motor names for motor/<m>/current_q, separated by spaces
      - path: width_scale
        type: number
        unit: m per joint unit
        default: 1.0
        meaning: opening = width_offset + width_scale x the sum of the finger joints' positions
      - path: width_offset
        type: number
        unit: m
        default: 0.0
        meaning: opening at zero joint positions
      - path: torque_constant
        type: number
        unit: N·m/A
        default: 1.0
        min_exclusive: 0
        meaning: for the current proxy, |joint torque| / torque_constant (N/A on slides)
      - path: contact_threshold
        type: number
        unit: N
        default: 0.5
        min: 0
        meaning: a finger touches above this contact force
        source: illustrative
      - path: slip_threshold
        type: number
        unit: m/s
        default: 0.005
        min: 0
        meaning: slip above this speed across the contact
        source: illustrative
      - path: closed_width
        type: number
        unit: m
        default: 0.001
        meaning: an opening at or below this holds nothing (fingers on each other)
      - path: contact_margin
        type: number
        unit: m
        default: 0.005
        min: 0
        meaning: how far beyond a finger's colliders an object is sought
      - path: object
        type: text
        default_from: a moving body outside the gripper's body tree within a finger's reach
        refers_to: body
        meaning: the held body by name
      - path: width_noise
        type: number
        unit: m
        default: 0.0
        min: 0
        meaning: 1 sigma
      - path: current_noise
        type: number
        unit: A
        default: 0.0
        min: 0
        meaning: 1 sigma
    signals:
      - name: width
        type: scalar
        unit: m
      - name: current
        type: scalar
        unit: A
      - name: grip_force
        type: scalar
        unit: N
      - name: object_detected
        type: bool
      - name: slip
        type: bool
      - name: slip_speed
        type: scalar
        unit: m/s
  humidity_sensor:
    name: Humidity and temperature sensor
    category: environment
    description: Relative humidity and temperature after the Sensirion SHT40, reading the weather's
      air through its own response time.
    doc: docs/design/domains/sensors.md#humidity_sensor
    references:
      - Sensirion SHT4x datasheet Version 7.3, tables 1 and 2
    renders: false
    params:
      - path: time_constant/humidity
        type: number
        unit: s
        default: 4
        min: 0
        meaning: τ63 of the humidity
        source: Sensirion SHT4x datasheet V7.3
      - path: time_constant/temperature
        type: number
        unit: s
        default: 2
        min: 0
        meaning: τ63 of the temperature
        source: Sensirion SHT4x datasheet V7.3
      - path: noise/humidity
        type: number
        unit: '1'
        default: 0.0002666666666666667
        min: 0
        meaning: '1σ: the 0.08 %RH repeatability is 3σ'
        source: Sensirion SHT4x datasheet V7.3
      - path: noise/temperature
        type: number
        unit: K
        default: 0.013333333333333334
        min: 0
        meaning: '1σ: the 0.04 °C repeatability is 3σ'
        source: Sensirion SHT4x datasheet V7.3
      - path: offset/humidity
        type: number
        unit: '1'
        default: 0
        meaning: 'its accuracy (SHT40: ±0.018 typical)'
      - path: offset/temperature
        type: number
        unit: K
        default: 0
        meaning: 'its accuracy (SHT40: ±0.2 K typical)'
      - path: resolution/humidity
        type: number
        unit: '1'
        default: 0.0001
        meaning: 0.01 %RH
        source: Sensirion SHT4x datasheet V7.3
      - path: resolution/temperature
        type: number
        unit: K
        default: 0.01
        meaning: 0.01 °C
        source: Sensirion SHT4x datasheet V7.3
    signals:
      - name: relative_humidity
        type: scalar
        unit: '1'
      - name: temperature
        type: scalar
        unit: K
      - name: valid
        type: bool
  imaging_radar:
    name: 4D imaging radar
    category: perception
    description: A cascaded-MIMO automotive radar reporting range, azimuth, elevation and Doppler
      per detection, resolved by the virtual array's cells, with Doppler and range folding and ground
      ghosts.
    doc: docs/design/domains/sensors.md#4d-imaging-radar-as-built
    references:
      - 'S. Rao, "Introduction to mmWave Sensing: FMCW Radars", Texas Instruments mmWave training,
        2017'
    renders: false
    params:
      - path: max_range
        type: number
        unit: m
        default_from: 'none: required'
        meaning: largest range reported
        min_exclusive: 0
      - path: azimuth_fov
        type: number
        unit: rad
        default_from: 'none: required'
        meaning: horizontal field of view, centred on +x
        min_exclusive: 0
      - path: elevation_fov
        type: number
        unit: rad
        default_from: 'none: required'
        meaning: vertical field of view
        min_exclusive: 0
      - path: tx_power
        type: number
        unit: W
        default_from: 'none: required'
        meaning: transmit power
        min_exclusive: 0
      - path: noise_floor
        type: number
        unit: W
        default_from: 'none: required'
        meaning: effective noise power the echo is compared with
        min_exclusive: 0
      - path: antenna_gain
        type: number
        unit: '1'
        default: 1
        meaning: linear, transmit and receive
      - path: detection_threshold
        type: number
        unit: '1'
        default: 10
        meaning: 'signal-to-noise ratio a detection needs (linear; 10: 10 dB)'
      - path: carrier_frequency
        type: number
        unit: Hz
        default: 77000000000.0
        meaning: '77 GHz: the automotive band'
        min_exclusive: 0
      - path: azimuth_resolution
        type: number
        unit: rad
        default: 0.035
        meaning: angle cell at boresight when azimuth_elements is not given
        min_exclusive: 0
      - path: elevation_resolution
        type: number
        unit: rad
        default_from: azimuth_resolution
        meaning: angle cell at boresight when elevation_elements is not given
        min_exclusive: 0
      - path: range_resolution
        type: number
        unit: m
        default_from: c / (2 · bandwidth) when bandwidth is given, else 0.2
        meaning: range cell
        min_exclusive: 0
      - path: velocity_resolution
        type: number
        unit: m/s
        default_from: λ / (2 · chirps · chirp_period) when both are given, else 0.1
        meaning: Doppler cell
        min_exclusive: 0
      - path: azimuth_elements
        type: number
        unit: '1'
        default: 0
        min: 0
        meaning: 'virtual channels (N_TX × N_RX) along azimuth; 0: use azimuth_resolution'
      - path: elevation_elements
        type: number
        unit: '1'
        default: 0
        min: 0
        meaning: 'virtual channels along elevation; 0: use elevation_resolution'
      - path: element_spacing
        type: number
        unit: wavelengths
        default: 0.5
        meaning: d; each angle cell is 1/(N·d) in direction sine
        min_exclusive: 0
      - path: bandwidth
        type: number
        unit: Hz
        default: 0
        min: 0
        meaning: 'sweep B; 0: none'
      - path: chirp_period
        type: number
        unit: s
        default: 0
        min: 0
        meaning: 'T_c; 0: none'
      - path: chirps
        type: number
        unit: '1'
        default: 0
        min: 0
        meaning: 'N_c; 0: none'
      - path: max_velocity
        type: number
        unit: m/s
        default_from: λ / (4 · chirp_period) when chirp_period is given, else 0 (no folding)
        min: 0
        meaning: the unambiguous velocity; velocities fold into [−v_max, v_max)
      - path: unambiguous_range
        type: number
        unit: m
        default: 0
        min: 0
        meaning: 'ranges beyond it fold back; 0: no folding'
      - path: ghost_reflection
        type: number
        unit: '1'
        default: 0
        min: 0
        max: 1
        meaning: 'the ground''s power reflection |Γ|² for multipath ghosts; 0: none'
      - path: peak_grouping
        type: bool
        default: 1
        meaning: '1: cells merge into their local peak; 0: every cell over the threshold'
      - path: max_detections
        type: int
        unit: '1'
        default: 256
        min: 1
        max: 4096
        meaning: detections per scan
      - path: ray_spacing
        type: number
        unit: rad
        default_from: half the finer angle cell at boresight
        meaning: between rays (at most 2 000 000 rays over the field of view)
        min_exclusive: 0
    signals:
      - name: detections
        type: scalar_array
        unit: '1'
        length_from: 6 × max_detections (range, azimuth, elevation, velocity, rcs, snr)
      - name: count
        type: int
    ros:
      - topic: detections
        type: sensor_msgs/msg/PointCloud2
  joint_torque:
    name: Joint torque sensor
    category: motion_and_force
    description: A link-side joint torque sensor, as in each joint of a Franka Panda or a KUKA LBR
      iiwa; the reaction's moment about the joint axis (its force along the axis on a slide).
    doc: docs/design/domains/sensors.md#joint_torque
    references:
      - Franka FR3 datasheet R02212 2.6, July 2026 (no torque sensor figures published)
      - 'KUKA LBR iiwa 7 R800 / 14 R820 spec sheet: axis-specific torque accuracy ±2 % of maximum
        torque'
    renders: false
    params:
      - path: joint
        type: text
        default_from: the joint whose child is the sensor's body
        refers_to: joint
        meaning: the joint it measures
      - path: range
        type: number
        unit: N·m
        default: .inf
        meaning: clipping (saturated reads 1); N on a slide
      - path: resolution
        type: number
        unit: N·m
        default: 0.0
        meaning: 'step the reading is rounded to; 0: none; N on a slide'
      - path: noise
        type: number
        unit: N·m
        default: 0.0
        meaning: 1 sigma; N on a slide
      - path: offset
        type: number
        unit: N·m
        default: 0.0
        meaning: bias; N on a slide
      - path: cutoff_frequency
        type: number
        unit: Hz
        default: 0.0
        meaning: 'first-order low-pass; 0: none'
    signals:
      - name: torque
        type: scalar
        unit: N·m
        only_when: a hinge
      - name: force
        type: scalar
        unit: N
        only_when: a slide
      - name: saturated
        type: bool
    ros:
      - topic: joint_state
        type: sensor_msgs/msg/JointState
  landing_target:
    name: Landing target detector
    category: perception
    description: A vision landing-target detector (AprilTag or ArUco pad under a downward camera,
      IR-LOCK style beacons) at the detector level, with PX4's meaning of MAVLink LANDING_TARGET.
      The target is a scene prim, seen when wholly in view, in range, facing the camera, not hidden
      and large enough to decode.
    doc: docs/design/domains/sensors.md#landing_target
    references:
      - MAVLink common.xml LANDING_TARGET (angle_x, angle_y, distance, size_x, size_y)
    renders: false
    params:
      - path: target
        type: text
        default: landing_pad
        refers_to: prim
        meaning: the prim (name or path); its box's top face centre is the target point, its +z its
          normal
      - path: target_size
        type: number
        unit: m
        default_from: its box's x and y extents, else 1 m
        min: 0
        meaning: 'side of the marker (0 or absent: from the prim''s box)'
      - path: horizontal_fov
        type: number
        unit: rad
        default: 1.047
        min: 0
        max: 3.1
        meaning: the camera's horizontal view (sensor x forward)
      - path: vertical_fov
        type: number
        unit: rad
        default_from: from horizontal_fov and width x height
        min: 0
        max: 3.1
        meaning: the camera's vertical view
      - path: width
        type: number
        unit: px
        default: 640
        min: 1
        meaning: the image width, for pixels across the marker
      - path: height
        type: number
        unit: px
        default_from: width x 3/4 (480 at the default width)
        meaning: the image height
      - path: min_range
        type: number
        unit: m
        default: 0.05
        meaning: 'nearer: not detected'
      - path: max_range
        type: number
        unit: m
        default: 30
        meaning: 'farther: not detected (above min_range)'
      - path: min_pixels
        type: number
        unit: px
        default: 12
        min: 0
        meaning: pixels across the marker's smaller side under which it is never decoded
        source: illustrative
      - path: max_incidence
        type: number
        unit: rad
        default: 1.2217
        meaning: the most the line of sight may be off the marker's normal (70 deg)
        source: illustrative
      - path: pixel_noise
        type: number
        unit: px
        default: 0.5
        min: 0
        meaning: 1 sigma of the corners' position
        source: illustrative
      - path: occlusion_margin
        type: number
        unit: m
        default: 0.05
        meaning: a collider this close in front of the target does not hide it
    signals:
      - name: detected
        type: bool
      - name: angle_x
        type: scalar
        unit: rad
      - name: angle_y
        type: scalar
        unit: rad
      - name: distance
        type: scalar
        unit: m
      - name: position
        type: vec3
        unit: m
      - name: size_x
        type: scalar
        unit: rad
      - name: size_y
        type: scalar
        unit: rad
  light_sensor:
    name: Ambient light sensor
    category: environment
    description: An ambient light sensor whose face looks along the sensor's +x, after the ROHM BH1750FVI,
      lit by the sun and the sky.
    doc: docs/design/domains/sensors.md#light_sensor
    references:
      - ROHM BH1750FVI datasheet 2011.11 Rev.D
    renders: false
    params:
      - path: start_utc
        type: text
        default_from: 'none: the weather''s env/sun_direction'
        meaning: UTC date and time at t = 0, YYYY-MM-DDTHH:MM:SSZ (with the site's geo origin)
      - path: sky
        type: enum
        default: clear
        choices:
          - clear
          - overcast
        meaning: clear or overcast
      - path: fog_depth
        type: number
        unit: m
        default: 100
        meaning: depth of fog the beam crosses per air mass
        source: illustrative
      - path: gain
        type: number
        unit: '1'
        default: 1
        min_exclusive: 0
        meaning: the BH1750's part-to-part ratio, 0.8 to 1.2
        source: ROHM BH1750FVI datasheet Rev.D
      - path: noise/fraction
        type: number
        unit: '1'
        default: 0
        min: 0
        meaning: 1σ, of the reading
      - path: resolution
        type: number
        unit: lx
        default: 0.8333333333333334
        min: 0
        meaning: one count in H-resolution mode (1/1.2 lx)
        source: ROHM BH1750FVI datasheet Rev.D, p. 7
      - path: max_illuminance
        type: number
        unit: lx
        default_from: 65535 counts × resolution (54 612 lx with the default resolution)
        meaning: the reading saturates there
        source: ROHM BH1750FVI datasheet Rev.D
      - path: ground_reflectance
        type: number
        unit: '1'
        default: 0
        min: 0
        max: 1
        meaning: light from the ground
    signals:
      - name: illuminance
        type: scalar
        unit: lx
      - name: valid
        type: bool
  line_sensor:
    name: Line guide sensor
    category: perception
    description: An AGV guide sensor, a row of channels across the sensor's y that look down for tape
      on the floor (a reflective line-follower array or a magnetic tape sensor), at the detector level.
    doc: docs/design/domains/sensors.md#line_sensor
    references:
      - Roboteq MGS1600GY magnetic guide sensor datasheet v1.3, 2018, table 11
    renders: false
    params:
      - path: channels
        type: int
        unit: '1'
        default: 16
        min: 1
        max: 1024
        meaning: channels in the row
      - path: spacing
        type: number
        unit: m
        default: 0.01
        min_exclusive: 0
        meaning: between channel centres; each channel is that wide
        source: illustrative
      - path: samples_per_channel
        type: int
        unit: '1'
        default: 5
        min: 1
        max: 64
        meaning: rays across a channel
      - path: max_range
        type: number
        unit: m
        default: 0.1
        min_exclusive: 0
        meaning: tape further below is not seen
      - path: noise
        type: number
        unit: '1'
        default: 0.02
        min: 0
        meaning: 1 sigma on each channel's activation
        source: illustrative
      - path: threshold
        type: number
        unit: '1'
        default: 0.2
        meaning: activation a channel counts from in offset and width
      - path: pattern
        type: text
        default: tape|line
        meaning: words that make a prim tape, separated by | or ,
      - path: tape_reflectivity
        type: number
        unit: '1'
        default: 0.8
        meaning: 905 nm reflectivity from which a collider's surface material counts as tape
      - path: dark_tape
        type: bool
        default: 0
        meaning: '1: tape darker than tape_reflectivity'
    signals:
      - name: channels
        type: scalar_array
        unit: '1'
        length_from: channels
      - name: offset
        type: scalar
        unit: m
      - name: width
        type: scalar
        unit: m
      - name: detected
        type: bool
  optical_flow:
    name: Optical flow
    category: camera
    description: A downward optical flow sensor such as the PixArt PMW3901 or PX4Flow, computed from
      the sensor's motion and the depth below it rather than by matching images.
    doc: docs/design/domains/sensors.md#optical_flow
    references:
      - PixArt PMW3901MB-TXQT Product Datasheet Version 1.00 (20 Mar 2017), table 3
      - Longuet-Higgins and Prazdny (1980)
      - PX4-Autopilot msg/SensorOpticalFlow.msg
    renders: false
    params:
      - path: fov
        type: number
        unit: rad
        default: 0.7330382858376184
        source: PixArt PMW3901MB-TXQT Product Datasheet Version 1.00 (20 Mar 2017), table 3 (42°)
        meaning: field of view the 3 × 3 rays span
        min_exclusive: 0
        max_exclusive: 3
      - path: min_range
        type: number
        unit: m
        default: 0.08
        min: 0
        source: PixArt PMW3901MB-TXQT Product Datasheet Version 1.00 (20 Mar 2017), table 3
        meaning: 'nearer ground: quality 0'
      - path: max_range
        type: number
        unit: m
        default: 30
        source: 'illustrative (PixArt: 80 mm to infinity)'
        meaning: 'farther ground: quality 0; above min_range'
      - path: max_flow_rate
        type: number
        unit: rad/s
        default: 7.4
        source: PixArt PMW3901MB-TXQT Product Datasheet Version 1.00 (20 Mar 2017), table 3
        meaning: 'faster flow: quality 0'
        min_exclusive: 0
      - path: noise
        type: number
        unit: rad/s
        default: 0.05
        min: 0
        source: illustrative (the datasheet gives no noise figure)
        meaning: white noise on each axis's rate, 1σ
    signals:
      - name: flow
        type: scalar_array
        unit: rad
        length: 2
      - name: quality
        type: scalar
        unit: '1'
      - name: distance
        type: scalar
        unit: m
      - name: integration_time
        type: scalar
        unit: s
    ros:
      - topic: flow
        type: geometry_msgs/msg/Vector3Stamped
  particle_sensor:
    name: Particulate matter sensor
    category: environment
    description: An optical particulate-matter sensor such as the Sensirion SPS30, reading PM1, PM2.5,
      PM4 and PM10 from the dust the weather domain and rotor outwash put in the air, with a first-order
      lag and the datasheet's precision as noise.
    doc: docs/design/domains/sensors.md#particle_sensor
    references:
      - Sensirion SPS30 datasheet, Version 2.0 - D1 - June 2023, table 1
    renders: false
    params:
      - path: time_constant
        type: number
        unit: s
        default: 8
        min: 0
        meaning: the reading's first-order lag (the SPS30's typical start-up time)
        source: Sensirion SPS30 datasheet v2.0 table 1; illustrative as a lag
      - path: noise_scale
        type: number
        unit: '1'
        default: 1
        min: 0
        meaning: 'times the datasheet precision (0: no noise)'
      - path: downwash_diameter
        type: number
        unit: m
        default: 0.0001
        min_exclusive: 0
        meaning: grains lifted by rotor outwash (the weather's ground_dust_diameter default)
    signals:
      - name: pm1
        type: scalar
        unit: kg/m^3
      - name: pm2_5
        type: scalar
        unit: kg/m^3
      - name: pm4
        type: scalar
        unit: kg/m^3
      - name: pm10
        type: scalar
        unit: kg/m^3
      - name: valid
        type: bool
  proximity:
    name: Proximity skin
    category: range_and_contact
    description: A collaborative robot's proximity skin, an array of short-range time-of-flight elements
      over a field of view, with the nearest as one signal.
    doc: docs/design/domains/sensors.md#proximity
    references:
      - ST VL53L0X DocID029104 Rev 2, §5.1 (field of view 25°) and table 12 (4 % standard deviation,
        33 ms, white target indoors)
    renders: false
    params:
      - path: rows
        type: int
        unit: '1'
        default: 1
        min: 1
        meaning: element rows (rows x columns at most 4096)
      - path: columns
        type: int
        unit: '1'
        default: 1
        min: 1
        meaning: element columns
      - path: fov
        type: number
        unit: rad
        default: 0.44
        min: 0
        meaning: spread of the columns about the sensor's +x
        source: ST VL53L0X DocID029104 Rev 2, §5.1 (25°)
      - path: vertical_fov
        type: number
        unit: rad
        default_from: fov
        min: 0
        meaning: spread of the rows
      - path: min_range
        type: number
        unit: m
        default: 0.0
        min: 0
        meaning: nearer reads +inf; below max_range
      - path: max_range
        type: number
        unit: m
        default: 0.3
        meaning: farther reads +inf
      - path: noise
        type: number
        unit: m
        default: 0.012
        min: 0
        meaning: 1 sigma per element
        source: 'ST VL53L0X table 12: 4 % standard deviation at the 0.3 m reach'
    signals:
      - name: distances
        type: scalar_array
        unit: m
        length_from: rows x columns
      - name: min_distance
        type: scalar
        unit: m
      - name: detected
        type: bool
    ros:
      - topic: range
        type: sensor_msgs/msg/Range
  rain_sensor:
    name: Rain gauge
    category: environment
    description: An optical rain gauge after the Hydreon RG-15, reading the weather's rain rate, the
      rain fallen since the start and whether it rains.
    doc: docs/design/domains/sensors.md#rain_sensor
    references:
      - Hydreon Rain Gauge Model RG-15 Instructions, SW rev 1.000, 2022.07.18
    renders: false
    params:
      - path: resolution
        type: number
        unit: m
        default: 0.0002
        min: 0
        meaning: the accumulation's step (0.2 mm; high resolution 0.02 mm)
        source: Hydreon RG-15
      - path: noise/gain
        type: number
        unit: '1'
        default: 0.05
        min: 0
        meaning: 1σ of a gain error drawn once per run (RG-15 ±10 % as 2σ)
        source: Hydreon RG-15
      - path: threshold
        type: number
        unit: m/s
        default: 2.777777777777778e-08
        min: 0
        meaning: raining above it (0.1 mm/h)
        source: illustrative
      - path: time_constant
        type: number
        unit: s
        default: 0
        min: 0
        meaning: first-order lag of the rate
      - path: snow
        type: bool
        default: 0
        meaning: '1: count snow too (melted water)'
    signals:
      - name: rain_rate
        type: scalar
        unit: m/s
      - name: accumulation
        type: scalar
        unit: m
      - name: raining
        type: bool
      - name: valid
        type: bool
  rangefinder:
    name: Laser rangefinder
    category: range_and_contact
    description: One laser beam along the sensor's +x, after the Benewake TFmini-S (set the range
      for a LightWare SF11/C).
    doc: docs/design/domains/sensors.md#rangefinder
    references:
      - Benewake TFmini-S Datasheet SJ-PM-TFmini-S A01
    renders: false
    params:
      - path: range/min
        type: number
        unit: m
        default: 0.1
        min: 0
        meaning: 'nearer: reads −inf (REP 117)'
        source: Benewake TFmini-S
      - path: range/max
        type: number
        unit: m
        default: 12
        meaning: 'above range/min; farther: reads +inf'
        source: Benewake TFmini-S
      - path: noise/stddev
        type: number
        unit: m
        default: 0.03
        min: 0
        meaning: 1σ, the least
        source: 'Benewake TFmini-S: ±6 cm as 2σ'
      - path: noise/fraction
        type: number
        unit: '1'
        default: 0.005
        min: 0
        meaning: 1σ of the range
        source: 'Benewake TFmini-S: ±1 % as 2σ'
      - path: resolution
        type: number
        unit: m
        default: 0.01
        meaning: range step
        source: Benewake TFmini-S
    signals:
      - name: range
        type: scalar
        unit: m
      - name: valid
        type: bool
    ros:
      - topic: range
        type: sensor_msgs/msg/Range
  safety_scanner:
    name: Safety laser scanner
    category: range_and_contact
    description: A safety laser scanner in the manner of SICK's nanoScan3 and microScan3, checking
      every return of a planar scan against a protective and a warning field; outputs switch one response
      time late.
    doc: docs/design/domains/sensors.md#safety_scanner
    references:
      - SICK data sheet NANS3-AAAZ30AN1 (part 1100333), nanoScan3 Core I/O
      - SICK nanoScan3 I/O operating instructions 8024602/1W27/2026-05-26, §14.2 table 33, §14.3
    renders: false
    params:
      - path: fov
        type: number
        unit: rad
        default: 4.799655442984406
        min_exclusive: 0
        max: 6.283185307179586
        meaning: aperture, centred on +x (275°)
        source: NANS3-AAAZ30AN1, scanning angle 275°
      - path: angular_resolution
        type: number
        unit: rad
        default: 0.0029670597283903604
        min_exclusive: 0
        meaning: between beams (0.17°)
        source: NANS3-AAAZ30AN1, angular resolution 0.17°
      - path: min_range
        type: number
        unit: m
        default: 0.0
        meaning: returns nearer are dropped; below max_range
      - path: max_range
        type: number
        unit: m
        default: 40.0
        meaning: returns farther are dropped
        source: NANS3-AAAZ30AN1, distance measuring range 40 m
      - path: range_noise
        type: number
        unit: m
        default: 0.0
        min: 0
        meaning: 1 sigma, per beam
      - path: response_time
        type: number
        unit: s
        default: 0.07
        min: 0
        max: 60
        meaning: delay of the outputs, rounded up to whole scans
        source: NANS3-AAAZ30AN1, response time 70 ms (2 x 30 ms scans + 10 ms)
      - path: switch_speed
        type: number
        unit: m/s
        default: 0.0
        min: 0
        meaning: 'forward speed (sensor x) at or above which the _fast fields watch; 0: off'
      - path: protective/polygon
        type: text
        default_from: none
        meaning: 'the protective field (required: a polygon, a radius or a rectangle): polygon ''x,y
          x,y x,y ...'' in m, sensor frame, even-odd rule; wins over radius and rectangle'
      - path: protective/radius
        type: number
        unit: m
        default_from: none
        meaning: 'the protective field (required: a polygon, a radius or a rectangle): a sector of
          this radius within the aperture'
      - path: protective/x_min
        type: number
        unit: m
        default: 0.0
        meaning: 'the protective field (required: a polygon, a radius or a rectangle): rectangle,
          near edge (used with x_max, y_min, y_max)'
      - path: protective/x_max
        type: number
        unit: m
        default_from: none
        meaning: 'the protective field (required: a polygon, a radius or a rectangle): rectangle,
          far edge'
      - path: protective/y_min
        type: number
        unit: m
        default_from: none
        meaning: 'the protective field (required: a polygon, a radius or a rectangle): rectangle,
          right edge'
      - path: protective/y_max
        type: number
        unit: m
        default_from: none
        meaning: 'the protective field (required: a polygon, a radius or a rectangle): rectangle,
          left edge'
      - path: warning/polygon
        type: text
        default_from: none
        meaning: 'the warning field: polygon ''x,y x,y x,y ...'' in m, sensor frame, even-odd rule;
          wins over radius and rectangle'
      - path: warning/radius
        type: number
        unit: m
        default_from: none
        meaning: 'the warning field: a sector of this radius within the aperture'
      - path: warning/x_min
        type: number
        unit: m
        default: 0.0
        meaning: 'the warning field: rectangle, near edge (used with x_max, y_min, y_max)'
      - path: warning/x_max
        type: number
        unit: m
        default_from: none
        meaning: 'the warning field: rectangle, far edge'
      - path: warning/y_min
        type: number
        unit: m
        default_from: none
        meaning: 'the warning field: rectangle, right edge'
      - path: warning/y_max
        type: number
        unit: m
        default_from: none
        meaning: 'the warning field: rectangle, left edge'
      - path: protective_fast/polygon
        type: text
        default_from: none
        meaning: 'the fast case''s protective field (required with switch_speed): polygon ''x,y x,y
          x,y ...'' in m, sensor frame, even-odd rule; wins over radius and rectangle'
      - path: protective_fast/radius
        type: number
        unit: m
        default_from: none
        meaning: 'the fast case''s protective field (required with switch_speed): a sector of this
          radius within the aperture'
      - path: protective_fast/x_min
        type: number
        unit: m
        default: 0.0
        meaning: 'the fast case''s protective field (required with switch_speed): rectangle, near
          edge (used with x_max, y_min, y_max)'
      - path: protective_fast/x_max
        type: number
        unit: m
        default_from: none
        meaning: 'the fast case''s protective field (required with switch_speed): rectangle, far edge'
      - path: protective_fast/y_min
        type: number
        unit: m
        default_from: none
        meaning: 'the fast case''s protective field (required with switch_speed): rectangle, right
          edge'
      - path: protective_fast/y_max
        type: number
        unit: m
        default_from: none
        meaning: 'the fast case''s protective field (required with switch_speed): rectangle, left
          edge'
      - path: warning_fast/polygon
        type: text
        default_from: the warning field
        meaning: 'the fast case''s warning field (default: warning): polygon ''x,y x,y x,y ...'' in
          m, sensor frame, even-odd rule; wins over radius and rectangle'
      - path: warning_fast/radius
        type: number
        unit: m
        default_from: the warning field
        meaning: 'the fast case''s warning field (default: warning): a sector of this radius within
          the aperture'
      - path: warning_fast/x_min
        type: number
        unit: m
        default: 0.0
        meaning: 'the fast case''s warning field (default: warning): rectangle, near edge (used with
          x_max, y_min, y_max)'
      - path: warning_fast/x_max
        type: number
        unit: m
        default_from: the warning field
        meaning: 'the fast case''s warning field (default: warning): rectangle, far edge'
      - path: warning_fast/y_min
        type: number
        unit: m
        default_from: the warning field
        meaning: 'the fast case''s warning field (default: warning): rectangle, right edge'
      - path: warning_fast/y_max
        type: number
        unit: m
        default_from: the warning field
        meaning: 'the fast case''s warning field (default: warning): rectangle, left edge'
    signals:
      - name: protective
        type: bool
      - name: warning
        type: bool
      - name: case
        type: int
        only_when: switch_speed > 0
      - name: min_distance
        type: scalar
        unit: m
      - name: ranges
        type: scalar_array
        unit: m
        length_from: floor(fov / angular_resolution) + 1
    ros:
      - topic: scan
        type: sensor_msgs/msg/LaserScan
  sonar:
    name: Sonar
    category: range_and_contact
    description: An underwater sonar, by default a multibeam imaging fan after the Blueprint Subsea
      Oculus M750d (750 kHz); with beams 1 a single-beam echosounder such as the Blue Robotics Ping2.
      It hears only under the surface of a WaterAPI_1 body of water.
    doc: docs/design/domains/sensors.md#sonar
    references:
      - Blueprint Subsea, Oculus M-series specifications page, blueprintsubsea.com/oculus/oculus-m-series,
        read 2026-11-12
      - Blue Robotics, Ping Sonar Altimeter and Echosounder store page, technical details, read 2026-11-12
      - Mackenzie, J. Acoust. Soc. Am. 70(3), 807–812, 1981
      - Ainslie and McColm, J. Acoust. Soc. Am. 103(3), 1671–1672, 1998
      - Mackenzie, J. Acoust. Soc. Am. 33(11), 1498–1504, 1961
      - Urick, Principles of Underwater Sound, 3rd ed., 1983, §5.1
    renders: false
    params:
      - path: beams
        type: int
        unit: '1'
        default: 512
        min: 1
        max: 4096
        meaning: 'across horizontal_fov, beam 0 on the left (+y); 1: a single beam'
        source: Oculus M750d
      - path: horizontal_fov
        type: number
        unit: rad
        default: 2.2689280275926285
        min: 0
        meaning: the fan's width (130°)
        source: Oculus M750d
      - path: vertical_fov
        type: number
        unit: rad
        default: 0.3490658503988659
        min: 0
        meaning: the fan's height (20°)
        source: Oculus M750d
      - path: beam_width
        type: number
        unit: rad
        default: 0.4363323129985824
        min_exclusive: 0
        meaning: full cone of a single beam (25°)
        source: Blue Robotics Ping2
      - path: vertical_rays
        type: int
        unit: '1'
        default: 5
        min: 1
        max: 64
        meaning: 'rays across vertical_fov per beam (a single beam: a grid of n × n in its cone)'
      - path: range/min
        type: number
        unit: m
        default: 0.1
        min: 0
        meaning: nearest echo
        source: Oculus M750d
      - path: range/max
        type: number
        unit: m
        default: 120
        meaning: farthest echo, above range/min; sets the ping interval 2·range/max / sound_speed
        source: Oculus M750d
      - path: resolution
        type: number
        unit: m
        default: 0.004
        meaning: range quantisation
        source: Oculus M750d
      - path: noise/stddev
        type: number
        unit: m
        default_from: resolution (0.004 m with the default)
        min: 0
        meaning: 1σ on the range
      - path: sound_speed
        type: number
        unit: m/s
        default: 1500
        min_exclusive: 0
        meaning: what the device converts time of flight with
        source: Urick, Principles of Underwater Sound, 1983
      - path: water_temperature
        type: number
        unit: °C
        default_from: 'none: the water''s sound speed is sound_speed; the absorption takes 10 °C'
        min: -2
        max: 40
        meaning: 'the water''s temperature in °C (not K): with it, the water''s own sound speed (Mackenzie)'
        source: illustrative
      - path: salinity
        type: number
        unit: PSU
        default: 35
        min: 0
        max: 45
        meaning: the water's salinity
        source: illustrative
      - path: ph
        type: number
        unit: '1'
        default: 8
        meaning: the water's acidity, for the absorption
        source: illustrative
      - path: frequency
        type: number
        unit: Hz
        default: 750000
        min_exclusive: 0
        meaning: for the absorption
        source: Oculus M750d
      - path: backscatter
        type: number
        unit: dB
        default: -27
        meaning: Lambert's 10·log10 μ, every surface
        source: Mackenzie, JASA 33(11), 1961
      - path: intensity_noise
        type: number
        unit: dB
        default: 1
        min: 0
        meaning: 1σ on the echo level
        source: illustrative
      - path: min_level
        type: number
        unit: dB
        default: -180
        meaning: weaker echoes are not detected
        source: illustrative
      - path: image_bins
        type: int
        unit: '1'
        default: 0
        min: 0
        max: 4096
        meaning: 'range bins of the polar image; 0: no image'
    signals:
      - name: ranges
        type: scalar_array
        unit: m
        length_from: beams
      - name: intensities
        type: scalar_array
        unit: dB
        length_from: beams
      - name: image
        type: scalar_array
        unit: dB
        length_from: beams × image_bins (only with image_bins)
      - name: depth
        type: scalar
        unit: m
      - name: sound_speed
        type: scalar
        unit: m/s
      - name: ping_interval
        type: scalar
        unit: s
      - name: valid
        type: bool
    ros:
      - topic: scan
        type: sensor_msgs/msg/LaserScan
      - topic: range
        type: sensor_msgs/msg/Range
  stereo_camera:
    name: Stereo depth camera
    category: camera
    description: 'An active stereo depth camera like the Intel RealSense D435: left and right infrared
      images a baseline apart and the left imager''s depth with a stereo matcher''s error and holes.'
    doc: docs/design/domains/sensors.md#stereo_camera
    references:
      - Intel RealSense D400 Series Datasheet 337029, table 3-49 (D435)
      - Grunnet-Jepsen et al., "Tuning depth cameras for best performance" (Intel RealSense white
        paper)
    renders: true
    params:
      - path: width
        type: int
        unit: px
        default: 848
        min: 2
        source: Intel RealSense D400 Series Datasheet 337029, table 3-49 (D435) (a depth mode)
        meaning: the pixel array (also <camera><image><width>)
      - path: height
        type: int
        unit: px
        default: 480
        min: 1
        source: Intel RealSense D400 Series Datasheet 337029, table 3-49 (D435) (a depth mode)
        meaning: (also <camera><image><height>)
      - path: horizontal_fov
        type: number
        unit: rad
        default: 1.5184364492350666
        source: Intel RealSense D400 Series Datasheet 337029, table 3-49 (D435) (87°)
        meaning: (also <camera><horizontal_fov>)
        min_exclusive: 0
        max_exclusive: 3.1
      - path: near_clip
        type: number
        unit: m
        default: 0.05
        meaning: (also <camera><clip><near>)
      - path: baseline
        type: number
        unit: m
        default: 0.05
        source: Intel RealSense D400 Series Datasheet 337029, table 3-49 (D435)
        meaning: ''
        min_exclusive: 0
      - path: subpixel
        type: number
        unit: px
        default: 0.08
        min: 0
        source: Grunnet-Jepsen et al., "Tuning depth cameras for best performance" (Intel RealSense
          white paper)
        meaning: σ_d, the sub-pixel disparity error
      - path: max_disparity
        type: number
        unit: px
        default: 126
        source: Grunnet-Jepsen et al., "Tuning depth cameras for best performance" (Intel RealSense
          white paper)
        meaning: the disparity search range; sets min-Z = f b / max_disparity
        min_exclusive: 0
      - path: max_range
        type: number
        unit: m
        default: 10
        source: 'illustrative (D400: 0.2 m to over 3 m; the white paper up to about 10 m)'
        meaning: beyond it depth reads +inf
        min_exclusive: 0
      - path: depth_unit
        type: number
        unit: m
        default: 0.001
        min: 0
        source: Intel RealSense D400 Series Datasheet 337029, table 3-49 (D435)
        meaning: output quantum; 0 for none
    signals:
      - name: depth
        type: image
        unit: m
      - name: left
        type: image
      - name: right
        type: image
      - name: depth/intrinsics
        type: scalar_array
        unit: '1'
        length: 4
      - name: depth/position
        type: vec3
        unit: m
      - name: left/intrinsics
        type: scalar_array
        unit: '1'
        length: 4
      - name: left/position
        type: vec3
        unit: m
      - name: right/intrinsics
        type: scalar_array
        unit: '1'
        length: 4
      - name: right/position
        type: vec3
        unit: m
    ros:
      - topic: left/image_raw
        type: sensor_msgs/msg/Image
      - topic: right/image_raw
        type: sensor_msgs/msg/Image
      - topic: depth/image_raw
        type: sensor_msgs/msg/Image
      - topic: left/camera_info
        type: sensor_msgs/msg/CameraInfo
      - topic: right/camera_info
        type: sensor_msgs/msg/CameraInfo
      - topic: depth/camera_info
        type: sensor_msgs/msg/CameraInfo
  sun_sensor:
    name: Sun sensor
    category: environment
    description: A two-axis sun sensor looking along the sensor's +x, after the Solar MEMS nanoSSOC-A60.
    doc: docs/design/domains/sensors.md#sun_sensor
    references:
      - Solar MEMS nanoSSOC-A60 product sheet, solar-mems.com, 2024
    renders: false
    params:
      - path: start_utc
        type: text
        default_from: 'none: the weather''s env/sun_direction'
        meaning: as the light sensor's
      - path: sky
        type: enum
        default: clear
        choices:
          - clear
          - overcast
        meaning: as the light sensor's
      - path: fog_depth
        type: number
        unit: m
        default: 100
        meaning: as the light sensor's
        source: illustrative
      - path: fov
        type: number
        unit: rad
        default: 2.0943951023931953
        min_exclusive: 0
        max: 6.283185307179586
        meaning: full cone angle (120°)
        source: 'Solar MEMS nanoSSOC-A60: ±60°'
      - path: noise/stddev
        type: number
        unit: rad
        default: 0.0029088820866572155
        min: 0
        meaning: '1σ per axis (0.167°: the accuracy < 0.5° (3σ) over 3)'
        source: Solar MEMS nanoSSOC-A60
      - path: min_illuminance
        type: number
        unit: lx
        default: 1000
        meaning: the least direct beam it finds the sun in
        source: illustrative
    signals:
      - name: sun_direction
        type: vec3
        unit: '1'
      - name: sun_visible
