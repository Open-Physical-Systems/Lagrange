      - name: valid
        type: bool
  tag_reader:
    name: Floor tag reader
    category: perception
    description: A warehouse localisation reader for tags on the floor at the detector level. Mode
      rfid reads the nearest tag within a radius; mode qr (QR or Data Matrix under a downward camera)
      reads the tag nearest the optical axis in its footprint, with its offset and yaw.
    doc: docs/design/domains/sensors.md#tag_reader
    references: []
    renders: false
    params:
      - path: mode
        type: enum
        default: rfid
        choices:
          - rfid
          - qr
        meaning: rfid or qr
      - path: prefix
        type: text
        default_from: rfid_ in mode rfid, qr_ in mode qr
        meaning: scene prims whose name starts with it are tags
      - path: range
        type: number
        unit: m
        default: 0.1
        min_exclusive: 0
        only_when:
          mode: rfid
        meaning: from the sensor's origin to the tag point (an HF floor tag)
        source: illustrative
      - path: min_range
        type: number
        unit: m
        default: 0.01
        only_when:
          mode: qr
        meaning: least depth below the reader
      - path: max_range
        type: number
        unit: m
        default: 0.5
        min_exclusive: 0
        only_when:
          mode: qr
        meaning: most depth below the reader
      - path: horizontal_fov
        type: number
        unit: rad
        default: 0.8
        min_exclusive: 0
        max: 3.1
        only_when:
          mode: qr
        meaning: the footprint across the sensor's x
        source: illustrative
      - path: vertical_fov
        type: number
        unit: rad
        default_from: horizontal_fov
        min_exclusive: 0
        max: 3.1
        only_when:
          mode: qr
        meaning: the footprint across the sensor's y
      - path: max_incidence
        type: number
        unit: rad
        default: 0.79
        only_when:
          mode: qr
        meaning: the most the line of sight may be off the tag's normal (45 deg)
        source: illustrative
      - path: position_noise
        type: number
        unit: m
        default: 0.0005
        min: 0
        only_when:
          mode: qr
        meaning: 1 sigma on the offset's x and y
        source: illustrative
      - path: yaw_noise
        type: number
        unit: rad
        default: 0.005
        min: 0
        only_when:
          mode: qr
        meaning: 1 sigma
        source: illustrative
    signals:
      - name: detected
        type: bool
      - name: tag
        type: int
      - name: code
        type: int
      - name: tag_position
        type: vec3
        unit: m
      - name: offset
        type: vec3
        unit: m
      - name: yaw
        type: scalar
        unit: rad
  tension_sensor:
    name: Tension sensor
    category: power
    description: A strain-gauge load cell where a tether meets its body or its station, read by a
      bridge ADC (an Avia HX711 channel A by default).
    doc: docs/design/domains/sensors.md#tension_sensor
    references:
      - Avia Semiconductor HX711 datasheet, Table 2
    renders: false
    params:
      - path: tether
        type: text
        default_from: the stage's only TetherAPI_1 prim
        refers_to: tether
        meaning: which tether
      - path: end
        type: enum
        default: attach
        choices:
          - attach
          - anchor
        meaning: 'where the cell sits: the body (attach) or the station (anchor)'
      - path: capacity
        type: number
        unit: N
        default: 500
        source: illustrative
        meaning: rated load
        min_exclusive: 0
      - path: sensitivity
        type: number
        unit: V/V
        default: 0.002
        meaning: rated output at capacity (2 mV/V, a common figure)
        min_exclusive: 0
      - path: excitation
        type: number
        unit: V
        default: 5
        meaning: also the ADC's AVDD
        min_exclusive: 0
      - path: nonlinearity
        type: number
        unit: '1'
        default: 0
        meaning: bow at half load, fraction of capacity
      - path: hysteresis
        type: number
        unit: '1'
        default: 0
        meaning: loading to unloading at half load, fraction of capacity
      - path: noise
        type: number
        unit: N
        default: 0
        min: 0
        meaning: at the cell, 1σ
      - path: offset
        type: number
        unit: N
        default: 0
        meaning: zero balance
      - path: gain_error
        type: number
        unit: '1'
        default: 0
        meaning: reads (1 + gain_error) × the truth
      - path: adc/bits
        type: int
        unit: '1'
        default: 24
        min: 1
        source: Avia Semiconductor HX711 datasheet, Table 2
        meaning: two's complement
      - path: adc/gain
        type: number
        unit: '1'
        default: 128
        source: Avia Semiconductor HX711 datasheet, Table 2
        meaning: channel A gain
        min_exclusive: 0
      - path: adc/full_scale
        type: number
        unit: V
        default_from: 0.5 × excitation / adc/gain
        source: Avia Semiconductor HX711 datasheet, Table 2
        meaning: ±full_scale at the bridge
        min_exclusive: 0
      - path: adc/noise
        type: number
        unit: V
        default: 5.0e-08
        min: 0
        source: Avia Semiconductor HX711 datasheet, Table 2 (gain 128, 10 SPS)
        meaning: input noise, rms
      - path: adc/samples
        type: int
        unit: '1'
        default: 1
        min: 1
        max: 4096
        meaning: conversions averaged
      - path: rated_strain
        type: number
        unit: '1'
        default: 0.001
        meaning: strain at the gauges at capacity, for strain
    signals:
      - name: force
        type: scalar
        unit: N
      - name: strain
        type: scalar
        unit: '1'
      - name: valid
        type: scalar
        unit: '1'
  tpms:
    name: Tyre pressure monitor
    category: vehicle
    description: A tyre-pressure monitoring system, a pressure and temperature sensor in every WheelAPI_1
      tyre of its vehicle; the air follows Gay-Lussac at the ambient temperature, with an FMVSS No.
      138 warning.
    doc: docs/design/domains/sensors.md#tpms
    references:
      - 'FMVSS No. 138 (49 CFR 571.138 S4.2): warning at 25 % below the placard'
    renders: false
    params:
      - path: fill_pressure
        type: number
        unit: Pa
        default: 230000.0
        min_exclusive: 0
        meaning: the placard cold pressure, gauge (a typical car, 2.3 bar)
        source: illustrative
      - path: fill_temperature
        type: number
        unit: K
        default: 293.15
        min_exclusive: 0
        meaning: where it was filled (20 °C)
      - path: temperature
        type: number
        unit: K
        default_from: none (env/air_temperature from the weather domain)
        min_exclusive: 0
        meaning: the air's when the weather domain is off
      - path: leak_rate
        type: number
        unit: Pa/s
        default: 0.0
        min: 0
        meaning: every tyre
      - path: noise
        type: number
        unit: Pa
        default: 0.0
        min: 0
        meaning: 1 sigma
      - path: wheels
        type: text
        default_from: every WheelAPI_1 joint in the sensor's body tree
        refers_to: joint
        meaning: wheel joint names, separated by spaces
    signals:
      - name: pressure
        type: scalar_array
        unit: Pa
        length_from: the wheels
      - name: temperature
        type: scalar_array
        unit: K
        length_from: the wheels
      - name: warning
        type: bool
      - name: valid
        type: bool
  uwb:
    name: UWB ranging tag
    category: radio
    description: Ultra-wideband two-way ranging from a tag on the robot to fixed anchors, as a Qorvo
      (Decawave) DW1000 or DW3000 gives it, with the excess delay through material in the way.
    doc: docs/design/domains/sensors.md#uwb
    references:
      - DW1000 Datasheet Version 2.10
      - DW3000 Datasheet Version 1.1
      - ITU-R P.2040-1 Table 3
    renders: false
    params:
      - path: anchors
        type: text
        unit: m
        default_from: 'none: uwb_anchor* prims or bodies only (a run with no anchor is refused)'
        meaning: x y z; x y z; ... region-local anchors
      - path: range_noise
        type: number
        unit: m
        default: 0.1
        min: 0
        meaning: 1 sigma with line of sight
        source: DW1000 Datasheet Version 2.10, p. 1; DW3000 Datasheet Version 1.1
      - path: nlos_permittivity
        type: number
        unit: '1'
        default: 5.24
        min: 1
        meaning: relative permittivity of what blocks the line (concrete, 1-100 GHz)
        source: ITU-R P.2040-1 Table 3
      - path: nlos_noise
        type: number
        unit: m
        default: 0.3
        min: 0
        meaning: extra 1 sigma without line of sight
        source: illustrative
      - path: max_range
        type: number
        unit: m
        default: 50
        min_exclusive: 0
        meaning: beyond it the anchor drops out
        source: illustrative (DW1000 datasheet figure 31)
    signals:
      - name: ranges
        type: scalar_array
        unit: m
        length_from: anchors
      - name: los
        type: scalar_array
        unit: '1'
        length_from: anchors
      - name: count
        type: int
      - name: valid
        type: bool
  v2x:
    name: V2X on-board unit
    category: radio
    description: A V2X on-board unit (DSRC IEEE 802.11p or C-V2X PC5) receiving the SAE J2735 Basic
      Safety Messages of the traffic agents and the Signal Phase and Timing of the signalised approaches,
      with distance-dependent message loss.
    doc: docs/design/domains/sensors.md#v2x
    references:
      - SAE J2735; SAE J2945/1
      - Meireles et al., IEEE VNC 2010
    renders: false
    params:
      - path: loss_distance
        type: number
        unit: m
        default: 300
        min_exclusive: 0
        meaning: where half the messages are lost
        source: illustrative
      - path: loss_width
        type: number
        unit: m
        default: 50
        min_exclusive: 0
        meaning: how fast the loss grows
        source: illustrative
      - path: range/max
        type: number
        unit: m
        default: 1000
        min_exclusive: 0
        meaning: nothing heard beyond
      - path: timeout
        type: number
        unit: s
        default: 0.5
        min: 0
        meaning: a sender counts as heard while its last message is this recent
    signals:
      - name: bsm
        type: scalar_array
        unit: '1'
        length_from: 10 x traffic agents (at least 10)
      - name: spat
        type: scalar_array
        unit: '1'
        length_from: 7 x signal heads (at least 7)
      - name: bsm_count
        type: int
      - name: spat_count
        type: int
      - name: valid
        type: bool
  vehicle_can:
    name: Vehicle CAN sensors
    category: vehicle
    description: What a production car's own sensors put on its CAN bus, for a VehicleAPI_1 robot
      - ABS wheel speeds from tone-ring edge timing, the steering wheel angle, the ESP cluster's yaw
      rate and accelerations, and the gear.
    doc: docs/design/domains/sensors.md#vehicle_can
    references: []
    renders: false
    params:
      - path: teeth
        type: int
        unit: '1'
        default: 48
        min: 1
        meaning: teeth of each ABS tone ring (43 to 100 are common)
        source: illustrative
      - path: steering_ratio
        type: number
        unit: '1'
        default: 15.5
        min_exclusive: 0
        meaning: steering wheel to road wheel
        source: illustrative
      - path: steering_resolution
        type: number
        unit: rad
        default: 0.0017453292519943296
        min: 0
        meaning: steering wheel angle step (0.1 deg)
        source: illustrative
      - path: yaw_rate_noise
        type: number
        unit: rad/s
        default: 0.0017453292519943296
        min: 0
        meaning: 1 sigma (0.1 deg/s)
        source: illustrative
      - path: acceleration_noise
        type: number
        unit: m/s^2
        default: 0.03
        min: 0
        meaning: 1 sigma
        source: illustrative
    signals:
      - name: wheel_speeds
        type: scalar_array
        unit: m/s
        length_from: WheelAPI_1 wheels
      - name: speed
        type: scalar
        unit: m/s
      - name: steering_wheel_angle
        type: scalar
        unit: rad
      - name: yaw_rate
        type: scalar
        unit: rad/s
      - name: longitudinal_acceleration
        type: scalar
        unit: m/s^2
      - name: lateral_acceleration
        type: scalar
        unit: m/s^2
      - name: gear
        type: scalar
        unit: '1'
      - name: valid
        type: bool
  visibility_sensor:
    name: Visibility sensor
    category: environment
    description: A forward-scatter visibility sensor after the Vaisala PWD22, reporting the meteorological
      optical range from the air's extinction.
    doc: docs/design/domains/sensors.md#visibility_sensor
    references:
      - Vaisala PWD series datasheet B210385EN-F
      - Vaisala PWD22 User's Guide M210543EN-B, table 24
    renders: false
    params:
      - path: range/min
        type: number
        unit: m
        default: 10
        min_exclusive: 0
        meaning: the least MOR it reports
        source: Vaisala PWD22
      - path: range/max
        type: number
        unit: m
        default: 20000
        meaning: the largest MOR it reports, above range/min
        source: Vaisala PWD22
      - path: noise/fraction
        type: number
        unit: '1'
        default: 0.05
        min: 0
        meaning: 1σ, of the MOR (±10 % as 2σ)
        source: Vaisala PWD22
      - path: noise/fraction_far
        type: number
        unit: '1'
        default_from: 1.5 × noise/fraction (0.075 with the default)
        min: 0
        meaning: 1σ beyond 10 km (±15 %)
        source: Vaisala PWD22
      - path: time_constant
        type: number
        unit: s
        default: 60
        min: 0
        meaning: first-order lag of the extinction
        source: Vaisala PWD22 User's Guide M210543EN-B, table 24
    signals:
      - name: visibility
        type: scalar
        unit: m
      - name: extinction
        type: scalar
        unit: 1/m
      - name: valid
        type: bool
  voltage_sensor:
    name: Voltage sensor
    category: power
    description: One voltage signal of the run (a bus, a battery's terminals) as a TI INA226 or a
      resistor divider into an ADC reads it.
    doc: docs/design/domains/sensors.md#current_sensor-and-voltage_sensor
    references:
      - TI INA226 datasheet SBOS547C §5.5, Tables 7-3 to 7-5
    renders: false
    params:
      - path: signal
        type: text
        default_from: 'none: required'
        refers_to: signal
        meaning: the run's voltage (V) signal to measure; a signal of the other unit is refused
      - path: model
        type: enum
        default: ina226
        choices:
          - ina226
          - divider
        meaning: the measuring part
      - path: conversion_time
        type: number
        unit: s
        default: 0.0011
        choices:
          - 0.00014
          - 0.000204
          - 0.000332
          - 0.000588
          - 0.0011
          - 0.002116
          - 0.004156
          - 0.008244
        only_when:
          model: ina226
        source: TI INA226 datasheet SBOS547C §5.5, Tables 7-3 to 7-5
        meaning: per conversion; the nearest listed value is taken
      - path: averages
        type: int
        unit: '1'
        default: 1
        min: 1
        max: 4096
        source: TI INA226 datasheet SBOS547C §5.5, Tables 7-3 to 7-5
        meaning: 'conversions averaged (INA226: the nearest of 1, 4, 16, 64, 128, 256, 512, 1024)'
      - path: channels
        type: int
        unit: '1'
        default: 2
        choices:
          - 1
          - 2
        only_when:
          model: ina226
        meaning: '2: shunt and bus, continuous (the power-on mode); a reading every conversion_time
          × channels × averages'
      - path: noise
        type: number
        unit: V
        default: 0
        min: 0
        meaning: white noise per conversion, 1σ, in volts at the ADC's input
      - path: offset
        type: number
        unit: V
        default: 0
        meaning: in volts at the ADC's input
      - path: gain_error
        type: number
        unit: '1'
        default: 0
        meaning: reads (1 + gain_error) × the truth
        min_exclusive: -1
      - path: ratio
        type: number
        unit: '1'
        default: 0.09090909090909091
        only_when:
          model: divider
        source: 'illustrative (1/11: 10 kΩ over 1 kΩ)'
        meaning: output over input
        min_exclusive: 0
      - path: adc/bits
        type: int
        unit: '1'
        default: 12
        min: 1
        max: 32
        only_when:
          model: divider
        meaning: the microcontroller's ADC
      - path: adc/reference
        type: number
        unit: V
        default: 3.3
        only_when:
          model: divider
        meaning: the ADC's range is 0 to adc/reference
        min_exclusive: 0
    signals:
      - name: voltage
        type: scalar
        unit: V
      - name: valid
        type: scalar
        unit: '1'
  wheel_odometry:
    name: Wheel odometry
    category: motion_and_force
    description: Dead reckoning of a differential drive from its wheel encoders, as its base controller
      computes it; slip shows up as drift.
    doc: docs/design/domains/sensors.md#wheel_odometry
    references: []
    renders: false
    params:
      - path: left_joint
        type: text
        default_from: the driven hinge at +y hanging off the sensor's body that carries a cylinder
          or sphere
        refers_to: joint
        meaning: the left wheel joint (give both or neither)
      - path: right_joint
        type: text
        default_from: the other such driven hinge
        refers_to: joint
        meaning: the right wheel joint
      - path: wheel_radius
        type: number
        unit: m
        default_from: the left wheel's first cylinder or sphere collider's radius
        min_exclusive: 0
        meaning: radius it believes
      - path: wheel_separation
        type: number
        unit: m
        default_from: track_width, else the wheels' distance apart along the body's y
        min_exclusive: 0
        meaning: track it believes
      - path: track_width
        type: number
        unit: m
        default_from: the wheels' distance apart (read only without wheel_separation)
        min_exclusive: 0
        meaning: another name for wheel_separation
      - path: radius_error
        type: number
        unit: '1'
        default: 0.0
        min_exclusive: -1
        meaning: relative error of both radii (0.01 is 1 % large)
      - path: radius_error_left
        type: number
        unit: '1'
        default_from: radius_error
        min_exclusive: -1
        meaning: relative error of the left radius
      - path: radius_error_right
        type: number
        unit: '1'
        default_from: radius_error
        min_exclusive: -1
        meaning: relative error of the right radius
      - path: separation_error
        type: number
        unit: '1'
        default: 0.0
        min_exclusive: -1
        meaning: relative error of the track
      - path: encoder_resolution
        type: number
        unit: counts/rev
        default: 0.0
        min: 0
        meaning: encoder counts per wheel turn; 0 reads the exact angle
    signals:
      - name: pose
        type: pose
        unit: m
      - name: yaw
        type: scalar
        unit: rad
      - name: twist
        type: wrench
        unit: m/s
    ros:
      - topic: odom
        type: nav_msgs/msg/Odometry
  wifi_scanner:
    name: Wi-Fi scanner
    category: radio
    description: What a Wi-Fi scan reports, the RSSI of every access point the robot hears, from the
      comms domain's links or a log-distance budget with wall losses.
    doc: docs/design/domains/sensors.md#wifi_scanner
    references:
      - IEEE 802.11-2020 Table 17-18 (OFDM minimum input sensitivity at 6 Mb/s, 20 MHz)
      - Linux mac80211 scan.c (IEEE80211_PROBE_DELAY, IEEE80211_CHANNEL_TIME, IEEE80211_PASSIVE_CHANNEL_TIME)
    renders: false
    params:
      - path: access_points
        type: text
        unit: m
        default_from: 'none: RadioLinkAPI_1 links on the sensor''s body and wifi_ap* prims or bodies
          only'
        meaning: x y z; x y z; ... region-local access points
      - path: scan_time
        type: number
        unit: s
        default: 2
        min: 0
        meaning: a new scan every so often; between scans the outputs hold
        source: illustrative
      - path: sensitivity
        type: number
        unit: dBm
        default: -82
        meaning: weaker access points are not listed
        source: IEEE 802.11-2020 Table 17-18
      - path: noise
        type: number
        unit: dB
        default: 0
        min: 0
        meaning: 1 sigma per reading, before rounding
      - path: tx_power
        type: number
        unit: W
        default: 0.1
        min_exclusive: 0
        meaning: 20 dBm
      - path: frequency
        type: number
        unit: Hz
        default: 2437000000.0
        min_exclusive: 0
        meaning: channel 6
      - path: path_loss_exponent
        type: number
        unit: '1'
        default: 3
        meaning: as the sample link
      - path: reference_distance
        type: number
        unit: m
        default: 1
        min_exclusive: 0
        meaning: Friis free space up to here
      - path: wall_loss_db
        type: number
        unit: dB
        default: 10
        min: 0
        meaning: per wall (as the sample link)
        source: illustrative
    signals:
      - name: rssi
        type: scalar_array
        unit: '1'
        length_from: access points (at least 1)
      - name: power
        type: scalar_array
        unit: W
        length_from: access points (at least 1)
      - name: count
        type: int
      - name: valid
        type: bool
