# The sensor catalog (RFC 0016 §5): every sensor the robot builder offers, with its parameters
# as the URDF reader takes them (server/src/Robot.cpp) and the signals it writes. Kept honest by
# test_sensor_catalog (the kinds are exactly sensors::builtinKinds(); every default written
# explicitly gives bit-identical signals to none) and tools/ci/check_sensor_catalog.py (every
# kind's parameters and defaults against its table in docs/design/domains/sensors.md §9).
#
# A parameter's `path` is the kind's own: <range><max> under the sensor's element is range/max,
# and the writer turns the form back into that XML. Values are SI as the code reads them (the
# one exception, battery_monitor's capacity in A·h, says so). `default` is the code's fallback;
# a parameter whose default depends on the world gives `default_from` in words instead.
# `only_when` names the mode a parameter is read in ({text parameter: value}, `a|b` for either).
# Other keys: `default_note` (a mode's other default, in words), `min`, `max`, `min_exclusive`,
# `max_exclusive` (the code refuses equality), `choices` (enum), `refers_to` (what a text
# parameter names: joint, body, signal, ...), `source` (the data sheet, or "illustrative", as
# sensors.md cites it), and on signals `length` or `length_from` (arrays) and `frame`.
# Plugins add kinds with their own files under the ament resource `lagrange_sensor_catalog`
# (the same layout, `kinds:` only, plus `plugin:` the library).
#
# `common` holds what every sensor has (not kind parameters, plan R9: written once). `types` are
# the built-in sensors the URDF reader takes; the IMU's noise is read from the first axis that
# has <noise> (imuNoise in Robot.cpp), so `{axis}` in its paths is written for each of `axes`
# with the same value (plan R9); the lidar's element is <lidar> or <ray>. Types marked
# `overlay_only` are not read from URDF: the builder writes them to the overlay YAML (formats.md
# §9, `create_child` with the schema, as quad_x500.overlay.yaml does), and their `path` is the
# schema attribute (schemas/sensor).
schema_version: 1
common:
  - path: update_rate
    type: number
    unit: Hz
    default: 10
    min_exclusive: 0
    meaning: samples per second; 0 (Gazebo's as fast as possible) is refused for kinds
  - path: pose
    type: pose
    meaning: x y z roll pitch yaw in the link's frame
  - path: latency
    type: number
    unit: s
    default: 0
    min: 0
    meaning: delay of the sensor's ROS messages and sensor/<n>/delayed/... (sensor timing)
  - path: jitter
    type: number
    unit: s
    default: 0
    min: 0
    meaning: 1σ of the latency's spread
types:
  imu:
    name: IMU
    category: motion_and_force
    urdf_types:
      - imu
    description: Three-axis gyro and accelerometer at the link, with SDFormat noise per channel.
    doc: docs/design/domains/sensors.md#2-models-per-fidelity-level
    axes:
      - x
      - y
      - z
    params:
      - path: imu/angular_velocity/{axis}/noise/stddev
        type: number
        unit: rad/s
        default: 0
        min: 0
        meaning: white noise, 1σ
      - path: imu/angular_velocity/{axis}/noise/bias_mean
        type: number
        unit: rad/s
        default: 0
        meaning: constant bias
      - path: imu/angular_velocity/{axis}/noise/bias_stddev
        type: number
        unit: rad/s
        default: 0
        min: 0
        meaning: spread of the bias drawn per run
      - path: imu/angular_velocity/{axis}/noise/dynamic_bias_stddev
        type: number
        unit: rad/s
        default: 0
        min: 0
        meaning: random walk of the bias
      - path: imu/angular_velocity/{axis}/noise/dynamic_bias_correlation_time
        type: number
        unit: s
        default: 0
        min: 0
        meaning: correlation time of the bias walk
      - path: imu/angular_velocity/{axis}/noise/precision
        type: number
        unit: rad/s
        default: 0
        min: 0
        meaning: output quantum
      - path: imu/linear_acceleration/{axis}/noise/stddev
        type: number
        unit: m/s^2
        default: 0
        min: 0
        meaning: white noise, 1σ
      - path: imu/linear_acceleration/{axis}/noise/bias_mean
        type: number
        unit: m/s^2
        default: 0
        meaning: constant bias
      - path: imu/linear_acceleration/{axis}/noise/bias_stddev
        type: number
        unit: m/s^2
        default: 0
        min: 0
        meaning: spread of the bias drawn per run
      - path: imu/linear_acceleration/{axis}/noise/dynamic_bias_stddev
        type: number
        unit: m/s^2
        default: 0
        min: 0
        meaning: random walk of the bias
      - path: imu/linear_acceleration/{axis}/noise/dynamic_bias_correlation_time
        type: number
        unit: s
        default: 0
        min: 0
        meaning: correlation time of the bias walk
      - path: imu/linear_acceleration/{axis}/noise/precision
        type: number
        unit: m/s^2
        default: 0
        min: 0
        meaning: output quantum
    signals:
      - name: specific_force
        type: vec3
        unit: m/s^2
      - name: angular_rate
        type: vec3
        unit: rad/s
      - name: orientation
        type: quat
    ros:
      - topic: /imu
        type: sensor_msgs/msg/Imu
  lidar:
    name: Lidar
    category: range_and_contact
    urdf_types:
      - lidar
      - gpu_lidar
      - ray
      - gpu_ray
    element:
      - lidar
      - ray
    description: 2D or 3D scans by rays over the scene; grid, flash or rosette patterns and channel
      tables.
    doc: docs/design/domains/sensors.md#lidar-scan-patterns-as-built
    params:
      - path: lidar/scan/horizontal/samples
        type: int
        default: 360
        min: 1
        meaning: beams per row
      - path: lidar/scan/horizontal/min_angle
        type: number
        unit: rad
        default: -3.14159265358979
      - path: lidar/scan/horizontal/max_angle
        type: number
        unit: rad
        default: 3.14159265358979
      - path: lidar/scan/vertical/samples
        type: int
        default: 1
        min: 1
        meaning: rows (channels)
      - path: lidar/scan/vertical/min_angle
        type: number
        unit: rad
        default: 0
      - path: lidar/scan/vertical/max_angle
        type: number
        unit: rad
        default: 0
      - path: lidar/scan/vertical/angles
        type: text
        meaning: 'channel table: one elevation per channel, rad, any order (replaces the even rows)'
      - path: lidar/range/min
        type: number
        unit: m
        default: 0.1
        min: 0
      - path: lidar/range/max
        type: number
        unit: m
        default: 30
      - path: lidar/noise/stddev
        type: number
        unit: m
        default: 0
        min: 0
        meaning: range noise, 1σ
      - path: lidar/motion_distortion
        type: bool
        default: 1
        meaning: each column fires from the sensor's pose at its moment in the scan
      - path: lidar/pattern
        type: enum
        choices:
          - grid
          - flash
          - rosette
        default: grid
        meaning: flash fires every beam at once
      - path: lidar/rosette/fov
        type: number
        unit: rad
        only_when:
          lidar/pattern: rosette
        default_from: the rosette's own (sensors.md, Lidar scan patterns)
      - path: lidar/rosette/point_rate
        type: number
        unit: Hz
        only_when:
          lidar/pattern: rosette
        default_from: the rosette's own
      - path: lidar/rosette/speed_1
        type: number
        unit: rad/s
        only_when:
          lidar/pattern: rosette
        default_from: the rosette's own
      - path: lidar/rosette/speed_2
        type: number
        unit: rad/s
        only_when:
          lidar/pattern: rosette
        default_from: the rosette's own
      - path: lidar/rosette/prism_ratio
        type: number
        unit: '1'
        only_when:
          lidar/pattern: rosette
        default_from: the rosette's own
    signals:
      - name: ranges
        type: scalar_array
        unit: m
      - name: intensities
        type: scalar_array
        unit: '1'
    ros:
      - topic: /scan
        type: sensor_msgs/msg/LaserScan
      - topic: /points
        type: sensor_msgs/msg/PointCloud2
  camera:
    name: Camera
    category: camera
    urdf_types:
      - camera
      - depth
      - depth_camera
      - rgbd_camera
      - thermal
      - thermal_camera
    description: One raster camera gives colour, depth and instance ids; thermal types read apparent
      temperature.
    doc: docs/design/domains/sensors.md#2-models-per-fidelity-level
    params:
      - path: camera/image/width
        type: int
        unit: px
        default: 640
        min: 1
      - path: camera/image/height
        type: int
        unit: px
        default: 480
        min: 1
      - path: camera/horizontal_fov
        type: number
        unit: rad
        default: 1.047
      - path: camera/clip/near
        type: number
        unit: m
        default: 0.05
        min: 0
      - path: camera/clip/far
        type: number
        unit: m
        default: 100
      - path: camera/lens/type
        type: enum
        choices:
          - gnomonical
          - equidistant
          - kannala_brandt
          - fisheye
        default: gnomonical
        meaning: 'equidistant (or kannala_brandt, fisheye): horizontal_fov is the lens''s angle across
          the width'
      - path: camera/lens/cutoff_angle
        type: number
        unit: rad
        only_when:
          camera/lens/type: equidistant
        default_from: 'none: the whole image'
      - path: camera/lens/k1
        type: number
        unit: '1'
        only_when:
          camera/lens/type: equidistant
        default: 0
        meaning: OpenCV fisheye coefficient
      - path: camera/lens/k2
        type: number
        unit: '1'
        only_when:
          camera/lens/type: equidistant
        default: 0
      - path: camera/lens/k3
        type: number
        unit: '1'
        only_when:
          camera/lens/type: equidistant
        default: 0
      - path: camera/lens/k4
        type: number
        unit: '1'
        only_when:
          camera/lens/type: equidistant
        default: 0
    signals:
      - name: image
        type: image
      - name: depth
        type: image
      - name: instance
        type: image
    ros:
      - topic: image_raw
        type: sensor_msgs/msg/Image
      - topic: depth/image_raw
        type: sensor_msgs/msg/Image
      - topic: instance/image_raw
        type: sensor_msgs/msg/Image
  gnss:
    name: GNSS receiver
    category: motion_and_force
    overlay_only: true
    schema: GnssAPI_1
    description: WGS84 position and ENU velocity of the antenna, placed on the Earth through the world's
      geo origin.
    doc: docs/design/domains/sensors.md#8-gnss-magnetometer-and-barometer-v04
    params:
      - path: sensor:gnss:horizontalNoiseStd
        type: number
        unit: m
        default: 0
        min: 0
        meaning: 1σ of each horizontal component
      - path: sensor:gnss:verticalNoiseStd
        type: number
        unit: m
        default: 0
        min: 0
        meaning: 1σ of the height
      - path: sensor:gnss:velocityNoiseStd
        type: number
        unit: m/s
        default: 0
        min: 0
        meaning: 1σ of each velocity component
    ros:
      - topic: fix
        type: sensor_msgs/msg/NavSatFix
  magnetometer:
    name: Magnetometer
    category: motion_and_force
    overlay_only: true
    schema: MagnetometerAPI_1
    description: The Earth's main field (World Magnetic Model 2025) in the sensor's frame.
    doc: docs/design/domains/sensors.md#8-gnss-magnetometer-and-barometer-v04
    params:
      - path: sensor:magnetometer:noiseStd
        type: number
        unit: T
        default: 0
        min: 0
        meaning: 1σ of each axis
    ros:
      - topic: field
        type: sensor_msgs/msg/MagneticField
  barometer:
    name: Barometer
    category: environment
    overlay_only: true
    schema: BarometerAPI_1
    description: Static pressure and air temperature at the sensor's height (ICAO standard atmosphere
      until a weather model gives the site's).
    doc: docs/design/domains/sensors.md#8-gnss-magnetometer-and-barometer-v04
    params:
      - path: sensor:barometer:noiseStd
        type: number
        unit: Pa
        default: 0
        min: 0
        meaning: 1σ of the pressure
    ros:
      - topic: pressure
        type: sensor_msgs/msg/FluidPressure
      - topic: temperature
        type: sensor_msgs/msg/Temperature
  radar:
    name: Automotive radar
    category: perception
    overlay_only: true
    schema: RadarAPI_1
    description: Rays launched over its field of view; a detection per object whose echo beats the
      threshold above the noise floor.
    doc: docs/design/domains/sensors.md#2-models-per-fidelity-level
    params:
      - path: sensor:radar:carrierFrequency
        type: number
        unit: Hz
        default: 77000000000
      - path: sensor:radar:rangeMax
        type: number
        unit: m
        required: true
      - path: sensor:radar:azimuthFov
        type: number
        unit: rad
        required: true
      - path: sensor:radar:elevationFov
        type: number
        unit: rad
        required: true
      - path: sensor:radar:azimuthResolution
        type: number
        unit: rad
        default: 0.035
      - path: sensor:radar:rangeResolution
        type: number
        unit: m
        default: 0.2
      - path: sensor:radar:velocityResolution
        type: number
        unit: m/s
        default: 0.1
      - path: sensor:radar:txPower
        type: number
        unit: W
        required: true
      - path: sensor:radar:antennaGain
        type: number
        unit: '1'
        default: 1
      - path: sensor:radar:noiseFloor
        type: number
        unit: W
        required: true
      - path: sensor:radar:detectionThreshold
        type: number
        unit: '1'
        default: 10
        meaning: 'linear SNR a detection needs (10: 10 dB)'
    ros:
      - topic: detections
        type: sensor_msgs/msg/PointCloud2
kinds:
  adsb_receiver:
    name: ADS-B receiver
    category: radio
    description: A 1090 MHz ADS-B receiver (1090ES, RTCA DO-260B) that hears the other aircraft of
      the run, their squittered position and velocity, within range and above the radio horizon.
    doc: docs/design/domains/sensors.md#adsb_receiver
    references:
      - RTCA DO-260B
      - ICAO Annex 10 Vol. IV 3.1.2.8.6.4.2 and .5; 3.1.2.6.5.4
      - Bean and Dutton, Radio Meteorology, 1966
      - J. Sun, The 1090 Megahertz Riddle, 2nd ed.
    renders: false
    params:
      - path: aircraft
        type: enum
        default: rotors
        choices:
          - rotors
          - all
        meaning: robots with RotorAPI_1 rotors, or every other robot whose root body is not kinematic
      - path: range/max
        type: number
        unit: m
        default: 100000
        min_exclusive: 0
        meaning: farther aircraft are not heard
        source: illustrative
      - path: horizon
        type: bool
        default: 1
        meaning: '0: no radio horizon'
      - path: antenna_height
        type: number
        unit: m
        default: 2
        meaning: the receiver's antenna above its mount, for the horizon
        source: illustrative
      - path: position_noise
        type: number
        unit: m
        default: 3
        min: 0
        meaning: 1 sigma per axis of the sender's GNSS position
        source: illustrative
    signals:
      - name: aircraft
        type: scalar_array
        unit: '1'
        length_from: 10 x aircraft (at least 10)
      - name: count
        type: int
      - name: geodetic
        type: bool
  airspeed:
    name: Airspeed (pitot)
    category: environment
    description: A pitot-static probe along the sensor's +x on a differential pressure sensor, after
      the TE MS4525DO-DS5AI001DP that PX4 and ArduPilot use.
    doc: docs/design/domains/sensors.md#airspeed
    references:
      - TE MS4525DO datasheet 04/2019
    renders: false
    params:
      - path: noise/stddev
        type: number
        unit: Pa
        default: 0
        min: 0
        meaning: 1σ
      - path: offset
        type: number
        unit: Pa
        default: 0
        meaning: zero offset
      - path: range
        type: number
        unit: Pa
        default: 6894.757
        min_exclusive: 0
        meaning: the reading clips there (±1 psi)
        source: MS4525DO-DS5AI001DP
      - path: resolution
        type: number
        unit: Pa
        default: 1.0521206433498136
        min: 0
        meaning: 'one count: 2·1 psi / (0.8·16383)'
        source: MS4525DO datasheet
      - path: temperature_resolution
        type: number
        unit: K
        default: 0.09770395701025891
        meaning: 11 bits over −50 … 150 °C
        source: MS4525DO datasheet
      - path: air_density
        type: number
        unit: kg/m^3
        default_from: the weather's env/air_density, else the site's
        meaning: only when neither the weather nor the site gives one
      - path: air_rotor
        type: text
        default_from: 'none: the aerodynamics domain''s env/wind/velocity'
        refers_to: rotor_joint
        meaning: as the anemometer's
    signals:
      - name: differential_pressure
        type: scalar
        unit: Pa
      - name: airspeed
        type: scalar
        unit: m/s
      - name: indicated_airspeed
        type: scalar
        unit: m/s
      - name: temperature
        type: scalar
        unit: K
      - name: valid
        type: bool
  anemometer:
    name: Anemometer
    category: environment
    description: Ultrasonic (2D or 3D, after the Gill WindSonic) or cup-and-vane (after the R. M.
      Young 05103) anemometer reading the air relative to the sensor.
    doc: docs/design/domains/sensors.md#anemometer
    references:
      - Gill WindSonic User Manual 1405-PS-0019 Issue 30 (2022), appendix A
      - R. M. Young 05103 Wind Monitor manual 05103-90 rev. N062819
    renders: false
    params:
      - path: type
        type: enum
        default: ultrasonic
        choices:
          - ultrasonic
          - cup
        meaning: ultrasonic, or cup (cups and a vane, horizontal only)
      - path: axes
        type: int
        unit: '1'
        default: 2
        choices:
          - 2
          - 3
        meaning: 2 or 3 (ultrasonic; a cup is always 2)
      - path: noise/fraction
        type: number
        unit: '1'
        default: 0.02
        default_note: 'cup: 0'
        min: 0
        meaning: speed noise, 1σ, of the speed
        source: 'Gill WindSonic: 2 % RMSE'
      - path: noise/speed
        type: number
        unit: m/s
        default: 0.01
        default_note: 'cup: 0'
        min: 0
        meaning: speed noise, 1σ, the least
        source: Gill WindSonic
      - path: noise/direction
        type: number
        unit: rad
        default: 0.017453292519943295
        default_note: 'cup: 0'
        min: 0
        meaning: 'direction noise, 1σ (1°: the WindSonic''s ±2° as 2σ)'
        source: Gill WindSonic
      - path: resolution/speed
        type: number
        unit: m/s
        default: 0.01
        meaning: speed step
        source: Gill WindSonic
      - path: resolution/direction
        type: number
        unit: rad
        default: 0.017453292519943295
        meaning: direction step (1°)
        source: Gill WindSonic
      - path: threshold/speed
        type: number
        unit: m/s
        default: 0.01
        default_note: 'cup: 1.0'
        min: 0
        meaning: below it the speed reads 0
        source: Gill WindSonic; R. M. Young 05103 (cup)
      - path: threshold/direction
        type: number
        unit: m/s
        default: 0.01
        default_note: 'cup: 1.1'
        min: 0
        meaning: below it the vane holds
        source: Gill WindSonic; R. M. Young 05103 (cup)
      - path: distance_constant
        type: number
        unit: m
        default: 0
        default_note: 'cup: 2.7'
        min: 0
        meaning: 'cup lag: first order, τ = L / V'
        source: R. M. Young 05103 (cup)
      - path: air_rotor
        type: text
        default_from: 'none: the aerodynamics domain''s env/wind/velocity'
        refers_to: rotor_joint
        meaning: read rotor/<j>/air_velocity instead of env/wind/velocity; a name that is no RotorAPI_1
          joint is refused
    signals:
      - name: wind_velocity
        type: vec3
        unit: m/s
      - name: wind_speed
        type: scalar
        unit: m/s
      - name: wind_direction
        type: scalar
        unit: rad
      - name: valid
        type: bool
  battery_monitor:
    name: Battery monitor
    category: power
    description: A smart battery's fuel gauge (a TI BQ40Z50 class part) or a power module on one battery
      of the electrical domain, in Smart Battery register steps.
    doc: docs/design/domains/sensors.md#battery_monitor
    references:
      - Smart Battery Data Specification Rev 1.1 (SBS-IF, 1998) §5.1
    renders: false
    params:
      - path: battery
        type: text
        default_from: the stage's only BatteryAPI_1 prim
        refers_to: battery
        meaning: which battery (its prim name); refused when there are none or several and none is
          named
      - path: capacity
        type: number
        unit: A·h
        default_from: the battery's elec:battery:capacity
        min: 0
        meaning: the pack's rated charge in A·h, only when the stage has no such battery prim (the
          one §9 parameter not in SI units)
      - path: voltage/resolution
        type: number
        unit: V
        default: 0.001
        min: 0
        source: Smart Battery Data Specification Rev 1.1 (SBS-IF, 1998) §5.1 (mV)
        meaning: the step of voltage
      - path: voltage/bits
        type: int
        unit: '1'
        default_from: none (the step is resolution)
        min: 1
        meaning: 'an ADC instead: step = full_scale / 2^bits (with full_scale)'
      - path: voltage/full_scale
        type: number
        unit: V
        default_from: none (no range)
        min: 0
        meaning: the ADC's range; with bits it sets the step
      - path: voltage/noise
        type: number
        unit: V
        default: 0
        min: 0
        meaning: white noise per conversion, 1σ
      - path: voltage/offset
        type: number
        unit: V
        default: 0
        meaning: fixed offset
      - path: voltage/gain_error
        type: number
        unit: '1'
        default: 0
        meaning: reads (1 + gain_error) × the truth
      - path: voltage/samples
        type: int
        unit: '1'
        default: 1
        min: 1
        max: 4096
        meaning: conversions averaged into one reading
      - path: current/resolution
        type: number
        unit: A
        default: 0.001
        min: 0
        source: Smart Battery Data Specification Rev 1.1 (SBS-IF, 1998) §5.1 (mA)
        meaning: the step of current
      - path: current/bits
        type: int
        unit: '1'
        default_from: none (the step is resolution)
        min: 1
        meaning: 'an ADC instead: step = full_scale / 2^bits (with full_scale)'
      - path: current/full_scale
        type: number
        unit: A
        default_from: none (no range)
        min: 0
        meaning: the ADC's range, ±full_scale; with bits the step is full_scale / 2^(bits-1)
      - path: current/noise
        type: number
        unit: A
        default: 0
        min: 0
        meaning: white noise per conversion, 1σ
      - path: current/offset
        type: number
        unit: A
        default: 0
        meaning: fixed offset
      - path: current/gain_error
        type: number
        unit: '1'
        default: 0
        meaning: reads (1 + gain_error) × the truth
      - path: current/samples
        type: int
        unit: '1'
        default: 1
        min: 1
        max: 4096
        meaning: conversions averaged into one reading
      - path: temperature/resolution
        type: number
        unit: K
        default: 0.1
        min: 0
        source: Smart Battery Data Specification Rev 1.1 (SBS-IF, 1998) §5.1 (0.1 K)
        meaning: the step of temperature
      - path: temperature/bits
        type: int
        unit: '1'
        default_from: none (the step is resolution)
        min: 1
        meaning: 'an ADC instead: step = full_scale / 2^bits (with full_scale)'
      - path: temperature/full_scale
        type: number
        unit: K
        default_from: none (no range)
        min: 0
        meaning: the ADC's range; with bits it sets the step
      - path: temperature/noise
        type: number
        unit: K
        default: 0
        min: 0
        meaning: white noise per conversion, 1σ
      - path: temperature/offset
        type: number
        unit: K
        default: 0
        meaning: fixed offset
      - path: temperature/gain_error
        type: number
        unit: '1'
        default: 0
        meaning: reads (1 + gain_error) × the truth
      - path: temperature/samples
        type: int
        unit: '1'
        default: 1
        min: 1
        max: 4096
        meaning: conversions averaged into one reading
      - path: soc/resolution
        type: number
        unit: '1'
        default: 0.01
        min: 0
        source: Smart Battery Data Specification Rev 1.1 (SBS-IF, 1998) §5.1 (%)
        meaning: the step of the state of charge
      - path: soc/bits
        type: int
        unit: '1'
        default_from: none (the step is resolution)
        min: 1
        meaning: 'an ADC instead: step = full_scale / 2^bits (with full_scale)'
      - path: soc/full_scale
        type: number
        unit: '1'
        default_from: none (no range)
        min: 0
        meaning: the ADC's range; with bits it sets the step
      - path: soc/noise
        type: number
        unit: '1'
        default: 0
        min: 0
        meaning: white noise per conversion, 1σ
      - path: soc/offset
        type: number
        unit: '1'
        default: 0
        meaning: fixed offset
      - path: soc/gain_error
        type: number
        unit: '1'
        default: 0
        meaning: reads (1 + gain_error) × the truth
      - path: soc/samples
        type: int
        unit: '1'
        default: 1
        min: 1
        max: 4096
        meaning: conversions averaged into one reading
      - path: remaining_capacity/resolution
        type: number
        unit: C
        default: 3.6
        min: 0
        source: Smart Battery Data Specification Rev 1.1 (SBS-IF, 1998) §5.1 (mAh = 3.6 C)
        meaning: the step of the remaining capacity
      - path: remaining_capacity/bits
        type: int
        unit: '1'
        default_from: none (the step is resolution)
        min: 1
        meaning: 'an ADC instead: step = full_scale / 2^bits (with full_scale)'
      - path: remaining_capacity/full_scale
        type: number
        unit: C
        default_from: none (no range)
        min: 0
        meaning: the ADC's range; with bits it sets the step
      - path: remaining_capacity/noise
        type: number
        unit: C
        default: 0
        min: 0
        meaning: white noise per conversion, 1σ
      - path: remaining_capacity/offset
        type: number
        unit: C
        default: 0
        meaning: fixed offset
      - path: remaining_capacity/gain_error
        type: number
        unit: '1'
        default: 0
        meaning: reads (1 + gain_error) × the truth
      - path: remaining_capacity/samples
        type: int
        unit: '1'
        default: 1
        min: 1
        max: 4096
        meaning: conversions averaged into one reading
    signals:
      - name: voltage
        type: scalar
        unit: V
      - name: current
        type: scalar
        unit: A
      - name: temperature
        type: scalar
        unit: K
      - name: soc
        type: scalar
        unit: '1'
      - name: remaining_capacity
        type: scalar
        unit: C
      - name: valid
        type: scalar
        unit: '1'
    ros:
      - topic: battery_state
        type: sensor_msgs/msg/BatteryState
  bumper:
    name: Bumper
    category: range_and_contact
    description: A contact switch on the sensor's body, pressed when what touches the body pushes
      it hard enough from the side it watches. Needs physics.
    doc: docs/design/domains/sensors.md#bumper
    references: []
    renders: false
    params:
      - path: threshold
        type: number
        unit: N
        default: 5.0
        min_exclusive: 0
        meaning: push that closes the switch
        source: illustrative
      - path: sector_min
        type: number
        unit: rad
        default: -3.141592653589793
        meaning: smallest angle of the contact it reports, sensor frame (0 straight ahead); below
          sector_max
      - path: sector_max
        type: number
        unit: rad
        default: 3.141592653589793
        meaning: largest angle of the contact it reports, sensor frame; above sector_min
      - path: vertical
        type: bool
        default: 0
        meaning: '1: the whole force counts, the vertical part too'
    signals:
      - name: pressed
        type: bool
      - name: force
        type: scalar
        unit: N
      - name: direction
        type: scalar
        unit: rad
  cliff:
    name: Cliff sensor
    category: range_and_contact
    description: A robot vacuum's cliff sensor, an infrared range finder looking down the sensor's
      -z; reports a cliff when the floor is farther than its threshold or not seen.
    doc: docs/design/domains/sensors.md#cliff
    references: []
    renders: false
    params:
      - path: min_range
        type: number
        unit: m
        default: 0.005
        min: 0
        meaning: nearer reads min_range (the floor is there); below max_range
        source: illustrative
      - path: max_range
        type: number
        unit: m
        default: 0.15
        meaning: farther reads +inf
        source: illustrative
      - path: threshold
        type: number
        unit: m
        default: 0.06
        min_exclusive: 0
        meaning: farther than this is a drop
        source: illustrative
      - path: rays
        type: int
        unit: '1'
        default: 1
        min: 1
        max: 64
        meaning: one straight down, the others on a ring at beam_angle; the nearest return wins
      - path: beam_angle
        type: number
        unit: rad
        default: 0.0
        min: 0
        max_exclusive: 1.5707963267948966
        meaning: half angle of the ring
      - path: range_noise
        type: number
        unit: m
        default: 0.0
        min: 0
        meaning: 1 sigma, per reading
      - path: ignore_own_body
        type: bool
        default: 1
        meaning: rays pass the sensor's own body's colliders
    signals:
      - name: range
        type: scalar
        unit: m
      - name: cliff
        type: bool
    ros:
      - topic: range
        type: sensor_msgs/msg/Range
  current_sensor:
    name: Current sensor
    category: power
    description: One current signal of the run (a motor's bus current, a branch current) as a TI INA226
      shunt monitor or an Allegro ACS712 Hall sensor reads it.
    doc: docs/design/domains/sensors.md#current_sensor-and-voltage_sensor
    references:
      - TI INA226 datasheet SBOS547C §5.5, Tables 7-3 to 7-5
      - Allegro ACS712-DS Rev. 22 (2024), ACS712ELCTR-05B
    renders: false
    params:
      - path: signal
        type: text
        default_from: 'none: required'
        refers_to: signal
        meaning: the run's current (A) signal to measure; a signal of the other unit is refused
      - path: model
        type: enum
        default: ina226
        choices:
          - ina226
          - hall
        meaning: the measuring part
      - path: shunt_resistance
        type: number
        unit: Ω
        default: 0.002
        only_when:
          model: ina226
        source: illustrative
        meaning: the shunt the INA226 reads
        min_exclusive: 0
      - path: conversion_time
        type: number
        unit: s
        default: 0.0011
        choices:
          - 0.00014
          - 0.000204
          - 0.000332
          - 0.000588
          - 0.0011
          - 0.002116
          - 0.004156
          - 0.008244
        only_when:
          model: ina226
        source: TI INA226 datasheet SBOS547C §5.5, Tables 7-3 to 7-5
        meaning: per conversion; the nearest listed value is taken
      - path: averages
        type: int
        unit: '1'
        default: 1
        min: 1
        max: 4096
        source: TI INA226 datasheet SBOS547C §5.5, Tables 7-3 to 7-5
        meaning: 'conversions averaged (INA226: the nearest of 1, 4, 16, 64, 128, 256, 512, 1024)'
      - path: channels
        type: int
        unit: '1'
        default: 2
        choices:
          - 1
          - 2
        only_when:
          model: ina226
        meaning: '2: shunt and bus, continuous (the power-on mode); a reading every conversion_time
          × channels × averages'
      - path: noise
        type: number
        unit: V
        default: 0
        min: 0
        default_note: 'hall: 0.0035 V (21 mV peak to peak as 6σ, Allegro ACS712-DS Rev. 22 (2024),
          ACS712ELCTR-05B)'
        meaning: white noise per conversion, 1σ, in volts at the ADC's input
      - path: offset
        type: number
        unit: V
        default: 0
        meaning: in volts at the ADC's input
      - path: gain_error
        type: number
        unit: '1'
        default: 0
        meaning: reads (1 + gain_error) × the truth
        min_exclusive: -1
      - path: supply
        type: number
        unit: V
        default: 5
        only_when:
          model: hall
        meaning: the ACS712's VCC
        min_exclusive: 0
      - path: sensitivity
        type: number
        unit: V/A
        default: 0.185
        only_when:
          model: hall
        source: Allegro ACS712-DS Rev. 22 (2024), ACS712ELCTR-05B
        meaning: output per ampere
        min_exclusive: 0
      - path: zero_output
        type: number
        unit: V
        default_from: supply / 2
        only_when:
          model: hall
        meaning: output at 0 A
      - path: adc/bits
        type: int
        unit: '1'
        default: 12
        min: 1
        max: 32
        only_when:
          model: hall
        meaning: the microcontroller's ADC
      - path: adc/reference
        type: number
        unit: V
        default_from: supply
        only_when:
          model: hall
        meaning: the ADC's range is 0 to adc/reference
        min_exclusive: 0
    signals:
      - name: current
        type: scalar
        unit: A
      - name: valid
        type: scalar
        unit: '1'
  detections:
    name: Ground-truth detections
    category: perception
    description: Ground-truth annotations for machine-learning datasets from a camera's instance image
      and the scene, per visible object its 2D box, pixels, occlusion, truncation, class and 3D box
      (KITTI conventions), and a semantic image. Runs in step with the camera it labels.
    doc: docs/design/domains/sensors.md#detections
    references:
      - Geiger, Lenz, Urtasun 2012, "Are we ready for autonomous driving?", CVPR (KITTI devkit_object
        readme)
    renders: false
    params:
      - path: camera
        type: text
        default_from: 'required: the camera sensor whose images it labels'
        refers_to: camera
        meaning: the camera sensor whose images it labels
      - path: semantic
        type: text
        # yamllint disable-line rule:line-length
        default: ground,floor,terrain=1;road,lane,sidewalk,crossing,marking=2;building,wall,house,shed,roof=3;car,sedan,vehicle,truck,bus,van=4;human,person,pedestrian,walker,actor=5;tree,bush,hedge,plant,vegetation=6;pole,sign,light,signal=7;box,crate,pallet,rack,shelf,barrel,cone=8
        meaning: 'word,word=ID;word=ID: the first rule with a whole word of the object''s name gives
          its class'
      - path: max_objects
        type: int
        unit: '1'
        default: 64
        min: 1
        max: 4096
        meaning: rows of detections, the most pixels first (clamped to 1..4096)
      - path: min_pixels
        type: number
        unit: px
        default: 1
        meaning: 'fewer visible pixels: not listed (still in the semantic image)'
      - path: occlusion
        type: bool
        default: 1
        meaning: '0: no occlusion renders (field 7 NaN)'
    signals:
      - name: detections
        type: scalar_array
        unit: '1'
        length_from: 16 x max_objects
      - name: count
        type: int
      - name: semantic
        type: image
    ros:
      - topic: detections
        type: vision_msgs/msg/Detection2DArray
      - topic: detections_3d
        type: vision_msgs/msg/Detection3DArray
  esc_telemetry:
    name: ESC telemetry
    category: power
    description: 'What a drone''s ESC (BLHeli_32, AM32) reports of the motor on a joint: speed, current,
      voltage, temperature and consumption, by KISS serial telemetry or bidirectional DShot.'
    doc: docs/design/domains/sensors.md#esc_telemetry
    references:
      - Betaflight src/main/sensors/esc_sensor.c (KISS)
      - Extended DShot Telemetry v2.1.1 (github.com/bird-sanctuary/extended-dshot-telemetry)
    renders: false
    params:
      - path: joint
        type: text
        default_from: 'none: required'
        refers_to: joint
        meaning: the motor's joint (the ElectricalMotorAPI_1 whose elec:joint it is)
      - path: protocol
        type: enum
        default: kiss
        choices:
          - kiss
          - dshot
        meaning: telemetry protocol
      - path: escs
        type: int
        unit: '1'
        default: 4
        min: 1
        only_when:
          protocol: kiss
        meaning: ESCs asked in turn on the shared wire
      - path: baud
        type: number
        unit: bit/s
        default: 115200
        only_when:
          protocol: kiss
        meaning: 'the wire''s rate: at most baud / (100 bits × escs) frames a second'
        min_exclusive: 0
      - path: extended_rate
        type: number
        unit: Hz
        default: 1
        only_when:
          protocol: dshot
        source: Extended DShot Telemetry v2.1.1 example schedule
        meaning: extended frames (temperature, voltage, current) a second
        min_exclusive: 0
      - path: pole_pairs
        type: number
        unit: '1'
        default_from: the motor's elec:polePairs
        min: 1
        meaning: needed when no motor prim drives the joint
      - path: gear_ratio
        type: number
        unit: '1'
        default_from: the motor's elec:gearRatio, else 1
        meaning: motor turns per joint turn
        min_exclusive: 0
      - path: bus
        type: text
        default_from: the motor's bus, through its ports
        refers_to: bus
        meaning: the bus whose voltage it reads
      - path: temperature_node
        type: text
        default_from: the motor's thermal node
        refers_to: node
        meaning: thermal/<node>/temperature stands for the ESC's
      - path: current/resolution
        type: number
        unit: A
        default: 0.01
        min: 0
        default_note: 'dshot: 1 A'
        meaning: the step of current in the frame
      - path: current/bits
        type: int
        unit: '1'
        default_from: none (the step is resolution)
        min: 1
        meaning: 'an ADC instead: step = full_scale / 2^bits (with full_scale)'
      - path: current/full_scale
        type: number
        unit: A
        default_from: none (no range)
        min: 0
        meaning: the ADC's range; with bits it sets the step
      - path: current/noise
        type: number
        unit: A
        default: 0
        min: 0
        meaning: white noise per conversion, 1σ
      - path: current/offset
        type: number
        unit: A
        default: 0
        meaning: fixed offset
      - path: current/gain_error
        type: number
        unit: '1'
        default: 0
        meaning: reads (1 + gain_error) × the truth
      - path: current/samples
        type: int
        unit: '1'
        default: 1
        min: 1
        max: 4096
        meaning: conversions averaged into one reading
      - path: voltage/resolution
        type: number
        unit: V
        default: 0.01
        min: 0
        default_note: 'dshot: 0.25 V'
        meaning: the step of voltage in the frame
      - path: voltage/bits
        type: int
        unit: '1'
        default_from: none (the step is resolution)
        min: 1
        meaning: 'an ADC instead: step = full_scale / 2^bits (with full_scale)'
      - path: voltage/full_scale
        type: number
        unit: V
        default_from: none (no range)
        min: 0
        meaning: the ADC's range; with bits it sets the step
      - path: voltage/noise
        type: number
        unit: V
        default: 0
        min: 0
        meaning: white noise per conversion, 1σ
      - path: voltage/offset
        type: number
        unit: V
        default: 0
        meaning: fixed offset
      - path: voltage/gain_error
        type: number
        unit: '1'
        default: 0
        meaning: reads (1 + gain_error) × the truth
      - path: voltage/samples
        type: int
        unit: '1'
        default: 1
        min: 1
        max: 4096
        meaning: conversions averaged into one reading
      - path: temperature/resolution
        type: number
        unit: °C
        default: 1
        min: 0
        meaning: the step of temperature in the frame (in °C, as the protocols count)
      - path: temperature/bits
        type: int
        unit: '1'
        default_from: none (the step is resolution)
        min: 1
        meaning: 'an ADC instead: step = full_scale / 2^bits (with full_scale)'
      - path: temperature/full_scale
        type: number
        unit: °C
        default_from: none (no range)
        min: 0
        meaning: the ADC's range; with bits it sets the step (in °C, as the protocols count)
      - path: temperature/noise
        type: number
        unit: °C
        default: 0
        min: 0
        meaning: white noise per conversion, 1σ (in °C, as the protocols count)
      - path: temperature/offset
        type: number
        unit: °C
        default: 0
        meaning: fixed offset (in °C, as the protocols count)
      - path: temperature/gain_error
        type: number
        unit: '1'
        default: 0
        meaning: reads (1 + gain_error) × the truth
      - path: temperature/samples
