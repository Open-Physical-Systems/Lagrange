# profiles/examples/quad_x500_live_air.yaml — the sample quadcopter in live air: as
# quad_x500_downwash.yaml, but the air round it is computed every step in a lattice Boltzmann
# box that follows it (rotor_aero.md §8), on a hardware GPU (without one, the fitted model of
# quad_x500_downwash.yaml runs). Its rotors fly in that air: the ground under a low hover (the
# fountain), a wall beside it and their own neighbours come out of the flow, not out of fits.
# Air density and speed of sound are this scenario's site parameters (ISA sea level). Run
# beside a building:
#   lagrange run profiles/examples/quad_x500_live_air.yaml \
#       --robot assets/robots/quad_x500/quad_x500.usda \
#       --world assets/worlds/drone_building/drone_building.urdf
schema_version: 1
stage: robots/quad_x500/quad_x500.usda

domains:
  rigid_body:   { enabled: true,  backend: mujoco, dt: 0.001 }
  electrical:   { enabled: true,  fidelity: averaged, dt: 0.00005 }
  thermal:      { enabled: false, substitute: ambient }
  aerodynamics: { enabled: true,  fidelity: drag, air_density: 1.225, downwash: true,
                  downwash_model: lbm }
  weather:      { enabled: false, substitute: clear }
  emi:          { enabled: false, substitute: zero }
  radiation:    { enabled: false, substitute: zero }
  sensors:      { enabled: true }
  rotor_aero:   { enabled: true,  fidelity: bem, ground_effect: true, air_density: 1.225,
                  speed_of_sound: 340.3 }

time: { real_time_factor: 1.0 }
