syntax = "proto3";
package lagrange.viewer.v1;

import "lagrange/viewer/v1/common.proto";
import "lagrange/viewer/v1/scene.proto";

message Command {
  uint64 request_id = 1; // echoed in CommandResult
  oneof command {
    Play play = 10;
    Pause pause = 11;
    Step step = 12;
    Seek seek = 13;
    SetRealTimeFactor set_rtf = 14;
    Reset reset = 15;

    RequestSnapshot request_snapshot = 20;
    GetAttributes get_attributes = 21;
    SetAttribute set_attribute = 22;
    SetTransform set_transform = 23;
    SetVisibility set_visibility = 24;

    LoadStage load_stage = 30;
    ImportRobot import_robot = 31;
    OpenRecording open_recording = 32;

    ValidateProfile validate_profile = 40;
    ApplyProfile apply_profile = 41;
    GetProfile get_profile = 42;

    SubscribeSensor subscribe_sensor = 50;
    SetRosGraphEnabled set_ros_graph = 51;
    SetOverlays set_overlays = 52;
  }
}

message Play {}
message Pause {}
message Step {
  uint32 ticks = 1;
  int64 duration_ns = 2;
} // one of the two; 0 = unused
message Seek {
  SimTime to = 1;
} // replay only
message SetRealTimeFactor {
  double target = 1;
} // 0 = unlimited
message Reset {}

message RequestSnapshot {}
message GetAttributes {
  repeated uint32 prims = 1;
}
message SetAttribute {
  uint32 prim = 1;
  Attribute attribute = 2;
  bool save_to_session_layer = 3;
}
message SetTransform {
  uint32 prim = 1;
  repeated double position = 2;
  repeated double quat_wxyz = 3;
}
message SetVisibility {
  uint32 prim = 1;
  bool visible = 2;
}

message LoadStage {
  string path = 1;
}
message ImportRobot {
  enum Format {
    FORMAT_UNSPECIFIED = 0;
    FORMAT_URDF = 1;
    FORMAT_XACRO = 2;
    FORMAT_SDF = 3;
    FORMAT_MJCF = 4;
  }
  Format format = 1;
  string path = 2; // path on the server's filesystem
  DataRef content = 3; // or the file content, when the viewer is remote
  string overlay_path = 4;
  repeated string xacro_args = 5;
}
message OpenRecording {
  string path = 1;
}

message ValidateProfile {
  string yaml = 1;
}
message ApplyProfile {
  string yaml = 1;
  bool restart = 2;
}
message GetProfile {}

message SubscribeSensor {
  string sensor = 1;
  bool enabled = 2;
  double max_rate_hz = 3;
}
message SetRosGraphEnabled {
  bool enabled = 1;
}
message SetOverlays {
  bool contacts = 1;
  bool forces = 2;
  string field_signal = 3;
}

message CommandResult {
  uint64 request_id = 1;
  bool ok = 2;
  string error = 3; // human-readable, one line
  oneof result {
    PrimAttributesList attributes = 10;
    ProfileValidation validation = 11;
    string imported_stage_path = 12;
  }
}
message PrimAttributesList {
  repeated PrimAttributes items = 1;
}

message ProfileValidation {
  bool valid = 1;
  repeated ProfileIssue issues = 2;
}
message ProfileIssue {
  enum Severity {
    SEVERITY_UNSPECIFIED = 0;
    SEVERITY_ERROR = 1;
    SEVERITY_WARNING = 2;
  }
  Severity severity = 1;
  string json_pointer = 2; // "/domains/electrical/dt"
  string message = 3;
}
